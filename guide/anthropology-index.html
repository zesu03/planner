<!DOCTYPE html>
<html lang="en" data-theme="light" data-size="m">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anthropology Index — UPSC Mains Current Affairs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
html{
  --ink:#22261F;
  --rail:#2B3129;
  --rail-2:#363D33;
  --rail-tx:#CFD3C9;
  --rail-tx2:#8D9487;
  --rail-hi:#F2F2EC;
  --rail-line:#3C4338;
  --rail-key:#4B5247;
  --card:#F7F6F1;
  --field:#DEDCD3;
  --p1:#14544F;
  --p2:#8A4226;
  --ochre:#9A7B0A;
  --ochre-bg:#F3EDD6;
  --ochre-tx:#7A6108;
  --mute:#6E7268;
  --line:rgba(34,38,31,.16);
  --hair:rgba(34,38,31,.09);
  --wash:rgba(255,255,255,.45);
  --mark:#F0E4B0;
  --mark-tx:inherit;
  --t-law:#5B4B8A;
  --t-pol:#1F6F3E;
  --t-fig:#8A6A0B;
  --t-theory:#8C3A50;
  --bodywt:400;
  --rd:16.5px;
  --serif:"Spectral",Georgia,"Times New Roman",serif;
  --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
html[data-size="s"]{--rd:15px}
html[data-size="l"]{--rd:18.5px}
html[data-theme="dark"]{
  --ink:#DEDCD2;
  --rail:#14170F;
  --rail-2:#252A20;
  --rail-tx:#B9BDB0;
  --rail-tx2:#82887A;
  --rail-hi:#E8E7DD;
  --rail-line:#2C3127;
  --rail-key:#3A4034;
  --card:#23271F;
  --field:#1A1D17;
  --p1:#6FBDB2;
  --p2:#DD9066;
  --ochre:#C9A227;
  --ochre-bg:#2F2A18;
  --ochre-tx:#D9B84A;
  --mute:#8E9487;
  --line:rgba(222,220,210,.17);
  --hair:rgba(222,220,210,.09);
  --wash:rgba(255,255,255,.035);
  --mark:#54491F;
  --mark-tx:#F2EAC8;
  --t-law:#A99AD4;
  --t-pol:#6BBF8A;
  --t-fig:#D2AE4E;
  --t-theory:#DE8AA0;
  --bodywt:300;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--field);color:var(--ink);
  font-family:var(--sans);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
a{color:var(--p1)}
:focus-visible{outline:2px solid var(--ochre);outline-offset:2px}

/* ---------- layout ---------- */
.wrap{display:flex;min-height:100vh;align-items:stretch}
.rail{
  width:252px;flex:0 0 252px;background:var(--rail);color:var(--rail-tx);
  padding:26px 0 30px;position:sticky;top:0;height:100vh;overflow-y:auto;
}
.main{flex:1;min-width:0;padding:34px 44px 90px;max-width:1180px}

/* ---------- rail ---------- */
.brand{padding:0 22px 20px}
.brand h1{
  font-family:var(--serif);font-weight:600;font-size:21px;line-height:1.15;
  margin:0 0 6px;color:var(--rail-hi);letter-spacing:-.01em;
}
.brand p{margin:0;font-size:12.5px;color:var(--rail-tx2);line-height:1.45}
.nav{padding:6px 12px 0}
.nav button{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:8px 10px;border-radius:3px;color:var(--rail-tx);font-size:14px;
}
.nav button:hover{background:var(--rail-2);color:var(--rail-hi)}
.nav button[aria-current="true"]{background:var(--rail-2);color:var(--rail-hi);font-weight:500}
.nav .k{
  font-size:10.5px;color:var(--rail-tx2);border:1px solid var(--rail-key);border-radius:2px;
  padding:0 4px;line-height:15px;margin-left:auto;
}
.railfoot{margin-top:22px;padding:16px 22px 0;border-top:1px solid var(--rail-line)}
.railfoot .rowline{display:flex;justify-content:space-between;font-size:12.5px;color:var(--rail-tx2);padding:3px 0}
.railfoot .rowline b{color:var(--rail-tx);font-weight:500;font-variant-numeric:tabular-nums}
.railfoot .note{font-size:11.5px;color:var(--rail-tx2);line-height:1.5;margin-top:12px}

/* ---------- headings ---------- */
.vhead{margin:0 0 4px;font-family:var(--serif);font-size:27px;font-weight:600;letter-spacing:-.015em}
.vsub{margin:0 0 26px;color:var(--mute);font-size:14px;max-width:60ch;line-height:1.5}

/* ---------- syllabus map ---------- */
.papers{display:grid;grid-template-columns:1fr 1fr;gap:34px}
@media(max-width:900px){.papers{grid-template-columns:1fr}}
.paperhead{display:flex;align-items:baseline;gap:9px;padding-bottom:8px;margin-bottom:4px;border-bottom:2px solid var(--ink)}
.paperhead h3{margin:0;font-family:var(--serif);font-size:17px;font-weight:600}
.paperhead span{font-size:12.5px;color:var(--mute);margin-left:auto;font-variant-numeric:tabular-nums}
.grp{margin-top:16px}
.grp>h4{
  margin:0 0 5px;font-size:12.5px;font-weight:600;color:var(--mute);
  padding-left:2px;
}
.unit{
  display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;
  padding:7px 8px 7px 0;border-bottom:1px solid var(--hair);
}
.unit:hover{background:var(--wash)}
.unit .code{
  flex:0 0 34px;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;
  color:#fff;background:var(--pc);border-radius:0 2px 2px 0;
  padding:2px 0;text-align:center;margin-top:1px;
}
.unit.empty .code{background:transparent;color:var(--mute);border:1px solid var(--line);border-left:3px solid var(--line)}
.unit .nm{flex:1;font-size:13.5px;line-height:1.35;padding-top:1px}
.unit.empty .nm{color:var(--mute)}
.tally{flex:0 0 auto;display:flex;gap:2px;padding-top:6px}
.tally i{width:4px;height:11px;background:var(--pc);display:block;border-radius:.5px}
.unit.empty .tally i{background:var(--line)}
.gap{font-size:11px;color:var(--mute);padding-top:3px;font-style:italic;font-family:var(--serif)}

/* ---------- cards ---------- */
.cards{display:flex;flex-direction:column;gap:14px}
.card{
  background:var(--card);border:1px solid var(--line);border-left:3px solid var(--pc);
  border-radius:2px;padding:16px 18px 15px;
}
.card .top{display:flex;align-items:flex-start;gap:12px}
.card h3{
  margin:0 0 6px;font-family:var(--serif);font-size:18.5px;font-weight:600;
  line-height:1.25;letter-spacing:-.01em;flex:1;
}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 9px}
.chip{
  font-size:11.5px;font-variant-numeric:tabular-nums;color:var(--pc);
  border:1px solid var(--pc);border-radius:2px;padding:1px 5px;line-height:16px;
  background:var(--wash);
}
.chip.plain{color:var(--mute);border-color:var(--line)}
.gist{font-family:var(--serif);font-size:calc(var(--rd)*1.03);font-weight:var(--bodywt);line-height:1.62;margin:0 0 12px;max-width:64ch}
.deploy{
  background:var(--ochre-bg);border-left:3px solid var(--ochre);
  padding:10px 13px;margin:0 0 4px;font-family:var(--serif);font-size:calc(var(--rd)*.95);
  font-weight:var(--bodywt);line-height:1.6;max-width:66ch;
}
.deploy b{font-family:var(--sans);font-size:11.5px;font-weight:600;color:var(--ochre-tx);display:block;margin-bottom:3px}
.expand{
  display:flex;align-items:center;gap:6px;margin-top:11px;
  font-size:13px;color:var(--mute);font-weight:500;
}
.expand:hover{color:var(--ink)}
.expand .tri{font-size:9px;transition:transform .16s ease}
.card[data-open="1"] .expand .tri{transform:rotate(90deg)}
.body{display:none;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.card[data-open="1"] .body{display:block}
.sec{margin-bottom:15px}
.sec:last-child{margin-bottom:0}
.sec>h5{
  margin:0 0 4px;font-size:12.5px;font-weight:600;color:var(--pc);
}
.sec p{margin:0 0 11px;font-family:var(--serif);font-size:var(--rd);font-weight:var(--bodywt);line-height:1.68;max-width:64ch}
.sec p:last-child{margin-bottom:0}
.sec ul{margin:0;padding-left:17px}
.sec li{font-family:var(--serif);font-size:var(--rd);font-weight:var(--bodywt);line-height:1.66;margin-bottom:8px;max-width:62ch}
.terms dt{font-weight:600;font-size:13.5px;margin-top:13px}
.terms dd{margin:1px 0 0;font-family:var(--serif);font-size:calc(var(--rd)*.94);font-weight:var(--bodywt);line-height:1.62;max-width:64ch;color:var(--ink);opacity:.88}
.src{margin-top:14px;padding-top:11px;border-top:1px solid var(--line);font-size:12.5px;color:var(--mute)}
.src a{color:var(--pc)}

/* mark control */
.mark{display:flex;gap:3px;flex:0 0 auto}
.mark button{
  font-size:11px;padding:2px 7px;border:1px solid var(--line);border-radius:2px;
  color:var(--mute);background:var(--wash);
}
.mark button:hover{border-color:var(--ink);color:var(--ink)}
.mark button[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}

/* ---------- example bank ---------- */
.filters{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.filters button{
  font-size:12.5px;padding:3px 10px;border:1px solid var(--line);border-radius:2px;
  color:var(--mute);background:var(--card);
}
.filters button:hover{border-color:var(--ink);color:var(--ink)}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.exlist{border-top:1px solid var(--line)}
.ex{
  display:flex;gap:14px;padding:11px 2px 11px 0;
  border-bottom:1px solid var(--hair);align-items:flex-start;
}
.ex:hover{background:var(--wash)}
.ex .kind{
  flex:0 0 62px;font-size:10.5px;font-weight:600;color:var(--tc);
  border-left:3px solid var(--tc);padding:2px 0 2px 7px;line-height:1.3;margin-top:3px;
}
.ex .txt{flex:1;font-family:var(--serif);font-size:calc(var(--rd)*.97);font-weight:var(--bodywt);line-height:1.6;max-width:68ch}
.ex .txt .meta{
  display:flex;flex-wrap:wrap;gap:5px;align-items:center;
  margin-top:6px;font-family:var(--sans);
}
.ex .src-lnk{font-size:11.5px;color:var(--mute)}
.ex .src-lnk:hover{color:var(--ink);text-decoration:underline}

/* ---------- contrast pairs ---------- */
.pair{
  background:var(--card);border:1px solid var(--line);border-radius:2px;
  padding:14px 16px;margin-bottom:12px;
}
.pair .axis{
  font-family:var(--serif);font-size:16.5px;font-weight:600;line-height:1.3;
  margin:0 0 11px;max-width:66ch;
}
.pair .sides{display:grid;grid-template-columns:1fr 1fr;gap:0}
@media(max-width:720px){.pair .sides{grid-template-columns:1fr}}
.pair .side{
  font-family:var(--serif);font-size:calc(var(--rd)*.94);font-weight:var(--bodywt);line-height:1.6;padding:0 16px 0 12px;
  border-left:3px solid var(--p1);
}
.pair .side.two{border-left-color:var(--p2)}
.pair .pmeta{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px;align-items:center}

/* ---------- reading aids ---------- */
/* When a long note is open, keep its title in view while scrolling */
.card[data-open="1"] .top{
  position:sticky;top:0;z-index:2;background:var(--card);
  padding:15px 18px 9px;margin:-16px -18px 8px;
  border-bottom:1px solid var(--line);
}
/* Focus mode: rail away, single centred column */
body.focus .rail{display:none}
body.focus .main{margin:0 auto;padding-top:46px;max-width:760px}
body.focus .papers{grid-template-columns:1fr}
.fbar{
  position:fixed;top:0;right:0;left:0;height:0;z-index:9;
}
body.focus .fbar{height:auto;padding:8px 18px;text-align:right;background:var(--field)}
.fbar button{font-size:12px;color:var(--mute)}
.fbar button:hover{color:var(--ink)}
body:not(.focus) .fbar{display:none}

/* rail reading controls */
.ctrls{margin-top:16px;padding-top:14px;border-top:1px solid var(--rail-line)}
.ctrls .lbl{font-size:11px;color:var(--rail-tx2);margin-bottom:5px}
.ctrls .row{display:flex;gap:3px;margin-bottom:9px}
.ctrls .row button{
  flex:1;font-size:11.5px;padding:4px 0;text-align:center;
  border:1px solid var(--rail-key);border-radius:2px;color:var(--rail-tx2);
}
.ctrls .row button:hover{color:var(--rail-hi);border-color:var(--rail-tx2)}
.ctrls .row button[aria-pressed="true"]{background:var(--rail-2);color:var(--rail-hi);border-color:var(--rail-tx2)}

/* ---------- search ---------- */
.searchbox{
  width:100%;max-width:640px;padding:11px 14px;font-size:16px;font-family:var(--serif);
  background:var(--card);border:1px solid var(--line);border-radius:2px;color:var(--ink);
  margin-bottom:8px;
}
.searchbox::placeholder{color:var(--mute)}
.hint{font-size:12.5px;color:var(--mute);margin-bottom:22px}
mark{background:var(--mark);color:var(--mark-tx);padding:0 1px}

/* ---------- entity index ---------- */
.tabs{display:flex;gap:2px;margin-bottom:20px;border-bottom:1px solid var(--line)}
.tabs button{
  padding:7px 13px;font-size:13.5px;color:var(--mute);
  border-bottom:2px solid transparent;margin-bottom:-1px;
}
.tabs button[aria-selected="true"]{color:var(--ink);font-weight:500;border-bottom-color:var(--ink)}
.ents{columns:3;column-gap:26px}
@media(max-width:900px){.ents{columns:2}}
@media(max-width:620px){.ents{columns:1}}
.ent{
  display:flex;gap:8px;width:100%;text-align:left;break-inside:avoid;
  padding:5px 4px;border-bottom:1px solid var(--hair);
}
.ent:hover{background:var(--wash)}
.ent .en{flex:1;font-size:13.5px;line-height:1.35}
.ent .ec{font-size:11.5px;color:var(--mute);font-variant-numeric:tabular-nums;padding-top:1px}

/* ---------- revise ---------- */
.flash{
  background:var(--card);border:1px solid var(--line);border-radius:2px;
  padding:38px 34px;max-width:620px;min-height:270px;
  display:flex;flex-direction:column;justify-content:center;
}
.flash .q{font-family:var(--serif);font-size:26px;font-weight:600;line-height:1.25;margin:0}
.flash .meta{font-size:12px;color:var(--mute);margin-top:10px}
.flash .a{
  font-family:var(--serif);font-size:calc(var(--rd)*1.02);font-weight:var(--bodywt);line-height:1.62;margin:18px 0 0;
  padding-top:16px;border-top:1px solid var(--line);
}
.flashbar{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.btn{
  padding:8px 15px;border:1px solid var(--ink);border-radius:2px;font-size:13.5px;
  background:var(--card);font-weight:500;
}
.btn:hover{background:var(--ink);color:var(--card)}
.btn.q{border-color:var(--line);color:var(--mute);font-weight:400}
.btn.q:hover{background:none;border-color:var(--ink);color:var(--ink)}

/* ---------- weeks ---------- */
.wk{border-bottom:1px solid var(--line);padding:13px 0}
.wk h3{margin:0 0 2px;font-family:var(--serif);font-size:17px;font-weight:600}
.wk .m{font-size:12.5px;color:var(--mute)}
.wk .t{margin-top:7px;display:flex;flex-wrap:wrap;gap:5px}

/* ---------- misc ---------- */
.back{font-size:13px;color:var(--mute);margin-bottom:14px;display:inline-block}
.back:hover{color:var(--ink)}
.empty-state{
  font-family:var(--serif);font-size:16px;color:var(--mute);
  padding:30px 0;max-width:56ch;line-height:1.55;
}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:20px;flex-wrap:wrap}
.count{font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
@media print{
  html{--ink:#111;--card:#fff;--field:#fff;--mute:#555;--bodywt:400;
       --line:rgba(0,0,0,.25);--hair:rgba(0,0,0,.14);--wash:transparent;
       --ochre-bg:#f6f1de;--mark:transparent;--rd:11pt;
       --t-law:#4A3E73;--t-pol:#1A5C34;--t-fig:#6F5509;--t-theory:#742F42}
  .rail,.nav,.expand,.mark,.toolbar,.tabs,.filters,.fbar,.back{display:none!important}
  .main{padding:0;max-width:none}
  .body{display:block!important}
  .card{break-inside:avoid;border-left-width:2px;page-break-inside:avoid}
  .card[data-open="1"] .top{position:static;margin:0;padding:0;border:0}
  .ex,.pair{break-inside:avoid;page-break-inside:avoid}
  body{background:#fff}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media(max-width:760px){
  .wrap{flex-direction:column}
  .rail{width:100%;flex:none;height:auto;position:static}
  .main{padding:24px 20px 70px}
  .nav{display:flex;flex-wrap:wrap;gap:4px}
  .nav button{width:auto}
  .nav .k{display:none}
}
</style>
</head>

  <main class="main" id="main"></main>

 context:"Proving that an extinct population interbred with us used to require their ancient DNA — a Neanderthal genome, a Denisovan finger bone — to compare against. Since 2010, when Svante Pääbo's team sequenced the Neanderthal genome and then read Denisovan DNA from a single Siberian cave, the clean replacement model has steadily weakened. This study pushes further by removing the requirement for a physical archaic sample.",

 news:"The UN theme for 9 August 2026 was 'Honouring Indigenous Midwives'. Two Indian field studies ground it. In Kalahandi district, Odisha (four remote villages of Lanjigarh block), Nalinikanta Rana of Maa Manikeshwari University and Sarita Bag, with fieldwork from November 2024 to February 2025 among 100 tribal women aged 17–45 plus birth attendants and health workers, found 66 per cent of deliveries still occur at home against 34 per cent institutional; 71 per cent prefer home birth; 68 per cent find hospitals too expensive; 60 per cent report mothers-in-law discouraging hospital births; 45 per cent lack transport money; 33 per cent cite distance and 30 per cent cite shyness — in households where 87 per cent earn under ₹10,000 a month and about a third of the women cannot read. In Kabirdham district, Chhattisgarh, among the Baiga, Abhishek Yadav and Dr Shailendra Kumar of Pt. Ravishankar Shukla University found the daai remains the trusted childbirth specialist decades after Janani Suraksha Yojana began incentivising institutional delivery.",

{
 id:"keylong", post:"p4", paper:"2",
 units:[["2","6.1"],["2","3.3"],["2","8.1"],["2","7.3"]],
 title:"Nati in Keylong: tribal festivals and the institutions of living tradition",
 gist:"The Lahaul-Spiti tribal festival is an entry point to the whole institutional complex through which tribal societies transmit culture — youth dormitories, sacred groves, totemic clans and calendrical festivals.",
 deploy:"Use Keylong's Nati and lama-led puja alongside the Ghotul, Dhumkuria, Morung and Jaher Than as a linked set showing how tribal institutions transmit culture — a compact package for answers on Nature-Man-Spirit, tribal social organisation, or cultural preservation.",
 news:"The Tribal Festival-2026 of Lahaul-Spiti opened on 14 August at Keylong with a procession of local traditions, performances of the Nati dance, and a religious ceremony conducted by Buddhist lamas joined by monks from monasteries across the region. Lahaul-Spiti is a Scheduled Area district whose Buddhist and mixed Hindu-Buddhist communities hold Scheduled Tribe status, and the annual gathering brings its dispersed valley populations together at the height of the short Himalayan summer.",
 context:"Indian ethnography has long documented the institutions doing this transmission work. Youth dormitories — the Ghotul of the Muria Gonds recorded in Elwin's The Muria and their Ghotul (1947), the Dhumkuria of the Oraons described by S.C. Roy, the Morung of the Naga tribes — trained the unmarried young in labour, custom, music and civic discipline under their own elected leaders. Sacred groves protect patches of old forest through ritual taboo, functioning simultaneously as shrine, seed bank and water source. Totemic clans bind lineages to species they must respect and may not harm, while dictating exogamy.",
 mechLabel:"Cultural mechanism",
 mech:"Cultural transmission in these societies is institutional, not merely familial. A dormitory converts adolescence into apprenticeship — folklore, dance and dispute settlement learned by doing, under peer officers such as the Ghotul's Sirdar and Belosa. A sacred grove converts belief into conservation by attaching supernatural sanction to ecological restraint. A totem converts kinship into environmental ethics. An annual festival assembles all of it into a single self-renewing performance. The dormitories have dwindled under schooling and missionary disapproval, making the surviving performative occasions carry more of the load.",
 synth:[
  "Vidyarthi's Nature-Man-Spirit Complex holds the frame together: forest, community and deity form one equilibrium, so the grove, the totem and the festival are not separate customs but expressions of a single integrated system — which is why disturbance to any corner reverberates through the whole.",
  "Barth's boundary-maintenance argument explains the contemporary politics: Nati at Keylong works today as a symbolic marker through which communities sustain distinct identity in constant interaction with dominant neighbours — ethnicity maintained at the boundary, not by isolation."
 ],
 terms:[
  ["Youth dormitory (Ghotul, Dhumkuria, Morung)","The tribal institution housing and training unmarried youth in custom, labour and collective discipline; Elwin's Muria monograph remains its classic study."],
  ["Sacred grove (Sarna, Jaher Than)","Forest patches protected by religious taboo and dedicated to village or clan deities; community conservation before conservation policy."],
  ["Totemism","The institutionalised association of clans with species or objects, combining reverence for nature with regulation of marriage through clan exogamy."],
  ["Traditional Ecological Knowledge (TEK)","The cumulative, orally transmitted body of knowledge about environments and their management held by indigenous communities."],
  ["Boundary maintenance (Barth)","The sustaining of ethnic identity through symbolic markers deployed in interaction with other groups, rather than through cultural isolation."]
 ],
 scholars:["Verrier Elwin","S.C. Roy","L.P. Vidyarthi","Fredrik Barth"],
 communities:["Muria Gond","Oraon","Naga","Lahaula"],

{
 id:"bastar", post:"p4", paper:"2",
 units:[["2","3.3"],["2","8.1"],["2","3.2"]],
 title:"Pat Jatra in Jagdalpur: Bastar Dussehra's seventy-five days begin",
 gist:"A 75-day festival centred on Danteshwari, conducted by hereditary functionaries drawn from villages across the erstwhile princely state, is the standing exhibit of tribal-Hindu ritual synthesis in central India.",
 deploy:"Bastar Dussehra's Pat Jatra opening, its hereditary functionaries and 75-day calendar make a complete worked example for the Sacred Complex, tribal-Hindu synthesis, or religion-and-polity answers. Map it directly onto Vidyarthi's three components.",
 news:"Bastar Dussehra, often described as the world's longest festival, began at Jagdalpur on 12 August 2026 with the Pat Jatra ritual, in which the first sacred wood is brought and traditional functionaries ceremonially forge the tools for building the great chariot. The festival runs about 75 days to late October, centres on Danteshwari, the presiding goddess of Bastar, and proceeds through a fixed calendar: Deri Gadai, Kachhangadi, Kalash Sthapana, Jogi Bithai, the Navratri observances and concluding ceremonies. Hereditary functionaries — Manjhi, Chalki, Pujari and Sevadars — conduct the rites, with participation from villages across the erstwhile Bastar princely state, whose communities include the Muria and Maria Gonds, Bhatra, Halba and Dhurwa. The tradition is attributed to Maharaja Purushottam Deo in the early fifteenth century.",
 context:"Bastar's ritual polity is old ethnographic ground: the kingdom integrated Gond clan deities into the state cult of Danteshwari, whose temple at Dantewada anchors the region's sacred geography, and each village deity travels to Jagdalpur for the festival — a ritual map of the former state redrawn every year. Anthropology has read such arrangements since W.V. Grigson's The Maria Gonds of Bastar (1938) and Elwin's central Indian corpus. The festival survived the abolition of the princely state and decades of insurgency.",
 mechLabel:"Cultural mechanism",
 mech:"The festival works as ritual federation. Authority is distributed among hereditary offices — Manjhi and Chalki as tribal chiefs and stewards, priests of Danteshwari, the committee coordinating dates — and each stage requires a different community's service: particular villages supply wood, particular castes build the chariot. Participation renews the compact between communities and the goddess-centred order once headed by the king. The ritual calendar is, functionally, the old state's constitution performed annually.",
 synth:[
  "Vidyarthi's Sacred Complex framework, developed at Gaya in 1961, transfers exactly: Danteshwari's shrines are the sacred geography, the 75-day calendar the sacred performances, the Manjhi-Chalki-Pujari hierarchy the sacred specialists.",
  "In Redfield's and McKim Marriott's terms, Bastar Dussehra shows universalization and parochialization running simultaneously — a pan-Indian festival name over a local goddess cult, tribal deities absorbed upward as the great tradition is absorbed downward."
 ],
 terms:[
  ["Sacred Complex (Vidyarthi)","The integrated whole of sacred geography, sacred performances and sacred specialists in a centre of pilgrimage; the standard Indian framework for analysing composite ritual systems."],
  ["Universalization / parochialization (Marriott)","The two-way traffic between little and great traditions; Bastar's goddess-centred Dussehra is the process caught mid-stream."],
  ["Manjhi and Chalki","Hereditary tribal offices of the Bastar ritual polity, mediating between villages and the Danteshwari cult."],
  ["State cult","A religious system organised around and legitimating political authority; Bastar Dussehra preserves a princely state cult inside a democratic polity."],
  ["Little and great traditions (Redfield)","The distinction between local, village-level religious practice and the literate, pan-regional tradition, with continuous exchange between them."]
 ],
 scholars:["L.P. Vidyarthi","Robert Redfield","McKim Marriott","W.V. Grigson","Verrier Elwin"],

 law:[],

{
 id:"slavetrade", post:"p5", paper:"1",
 units:[["1","9.5"],["1","1.1"],["1","6.0"]],
 title:"23 August: the slave trade, its abolition, and the anthropology of race",
 gist:"The remembrance day fixed to the Haitian uprising rather than to a European act of abolition centres the agency of the enslaved — and opens directly onto anthropology's most consequential internal battle, the fight over race.",
 deploy:"Use 23 August as an opening reference in answers on race and racism: it links the history of the discipline, the UNESCO statements, and the modern consensus on clinal variation in a single dateable example.",
 news:"23 August is the International Day for the Remembrance of the Slave Trade and its Abolition, observed under UNESCO's auspices. The date commemorates the night of 22–23 August 1791, when enslaved Africans in Saint-Domingue, present-day Haiti, rose in the insurrection that set in motion the destruction of the transatlantic slave trade and produced, in 1804, the first state founded by formerly enslaved people. The day was first celebrated in Haiti in 1998 and at Gorée Island, Senegal, in 1999. It is supported by UNESCO's Routes of Enslaved Peoples project, successor to the Slave Route Project launched in 1994.",
 context:"The slave trade sits at the origin of anthropology's fight over race. Nineteenth-century race science, from Morton's craniometry to Gobineau's racial hierarchies, supplied slavery and colonialism with intellectual cover. The discipline's rehabilitation began with Franz Boas, whose 1912 study of head form among immigrants showed that supposedly fixed racial traits shifted within a single generation of changed environment. After the Second World War, UNESCO turned to anthropologists to dismantle race science formally: the 1950 Statement on Race, drafted under Ashley Montagu's rapporteurship, and its 1951 revision declared race biologically meaningless as a rank ordering of humanity.",
 mechLabel:"Cultural and historical mechanism",
 mech:"Commemoration works as an instrument of collective memory. By fixing a date to the Haitian uprising rather than to a European act of abolition, UNESCO deliberately centres the agency of the enslaved: abolition is remembered as something won by resistance, not granted by decree. The Routes of Enslaved Peoples project translates this into research and pedagogy, tracing the demographic, culinary, musical and religious imprints of the African diaspora across the Atlantic world.",
 synth:[
  "Melville Herskovits, in The Myth of the Negro Past (1941), demolished the claim that enslavement had erased African culture, documenting African survivals in language, religion and family across the Americas; Sidney Mintz and Richard Price later reframed these survivals as creolization, the creation of new cultures under extreme constraint.",
  "The observance illustrates the shift from race as biology to race as social construct. Modern human variation is clinal and overwhelmingly within-population — connect to Lewontin's 1972 apportionment finding and the UNESCO statements."
 ],
 terms:[
  ["Scientific racism","The misuse of anthropometry and biology to assert innate racial hierarchy, dominant in the nineteenth century and formally repudiated by the UNESCO Statements on Race (1950, 1951)."],
  ["Creolization","The process by which displaced peoples forge new, blended cultural forms; central to diaspora studies from Herskovits to Mintz and Price."],
  ["Collective memory","Maurice Halbwachs's concept for the socially organised remembering of the past; commemorative days are its institutional form."],
  ["Cline","A gradient of trait frequency across geography; the empirical pattern that undermines discrete racial classification."],
  ["Lewontin's apportionment (1972)","The finding that the great majority of human genetic variation occurs within populations rather than between them."]
 ],
 scholars:["Franz Boas","Ashley Montagu","Melville Herskovits","Sidney Mintz","Richard Price","Richard Lewontin","Maurice Halbwachs","Samuel Morton","Arthur de Gobineau"],
 communities:[],
 law:["UNESCO Statements on Race (1950, 1951)","Routes of Enslaved Peoples project"],
 figures:["Uprising of 22–23 August 1791","Haiti independent 1804"]

{
 id:"towle", post:"p5", paper:"1",
 units:[["1","1.6"],["1","1.4"],["1","6.0"]],
 title:"A proposal to fold Australopithecus and Paranthropus into Homo",
 gist:"A paper argues the behavioural and ecological traits long used to keep the genera apart no longer hold — small-brained Homo species and increasingly capable australopithecines — and applies cladistic principles to redraw genus lines around demonstrable ancestry.",
 deploy:"Cite Towle (2026, American Journal of Biological Anthropology) in any answer on the phylogenetic status of the australopithecines or the validity of Homo habilis, as current evidence that hominin genus boundaries remain contested. The clean line: taxonomy is theory made visible.",
 news:"In 'Clades, Grades, and the Genus Problem: A Case for Revising Hominin Taxonomy', published on 20 August 2026 in the American Journal of Biological Anthropology, Dr Ian Towle of the Monash Biomedicine Discovery Institute argues that Australopithecus and Paranthropus should be reclassified within the genus Homo. His case rests on the erosion of the traits long used to keep the genera apart: some accepted members of Homo, such as Homo floresiensis and Homo naledi, had very small brains, while accumulating evidence credits Australopithecus and Paranthropus with complex behaviours, possibly including tool use.",
 context:"Genus boundaries in palaeoanthropology have always been argued, not discovered. Raymond Dart erected Australopithecus for the Taung child in 1925; Robert Broom's robust finds from Kromdraai and Swartkrans became Paranthropus; and Louis Leakey, Tobias and Napier stretched the definition of Homo in 1964 to admit Homo habilis on a brain size well below the then-accepted threshold. Ernst Mayr had already proposed in 1950 that all hominins be compressed into a single genus. Bernard Wood and Mark Collard's influential 1999 review argued the opposite, that habilis and rudolfensis belonged outside Homo.",
 mechLabel:"Scientific mechanism",
 mech:"The dispute turns on clades versus grades. A grade groups organisms by adaptive level — a way of life such as committed bipedalism or large-brained tool dependence — while a clade groups them strictly by common descent. Traditional hominin taxonomy is largely grade-based, and each new fossil that mixes traits across grade boundaries (small brains with tool use, big teeth with dexterous hands) weakens it. Cladistic reclassification would redraw genus lines around demonstrable ancestry, at the cost of making Homo an enormous and internally varied genus stretching back over four million years.",
 synth:[
  "The proposal echoes the Homo habilis controversy: if the 1964 redefinition of Homo was legitimate, the criteria for the genus have always been negotiable. Wood and Collard's 1999 criteria — body proportions, obligate bipedalism, modern-humanlike development — are the standard counterposition.",
  "As with Stringer and Wolpoff's disagreement over modern human origins, the fossils have not changed; the framework of interpretation has."
 ],
 terms:[
  ["Clade","A group containing an ancestor and all its descendants, defined purely by descent."],
  ["Grade","A group defined by a shared level of organisation or adaptation regardless of exact ancestry; grades can be paraphyletic and are therefore suspect in cladistic practice."],
  ["Cerebral Rubicon","A historical threshold of cranial capacity (traditionally 600–750 cc) proposed as the minimum brain volume for membership of Homo; now largely abandoned."],
  ["Lumping and splitting","Opposed taxonomic temperaments, minimising or multiplying named taxa from the same fossil evidence."],
  ["Mosaic evolution","The evolution of different traits at different rates, producing fossils that straddle grade boundaries and destabilise trait-based genera."]
 ],
 scholars:["Ian Towle","Raymond Dart","Robert Broom","Louis Leakey","Phillip Tobias","John Napier","Ernst Mayr","Bernard Wood","Mark Collard","Chris Stringer","Milford Wolpoff"],
 communities:[],

},
{
 id:"pelvis", post:"p5", paper:"1",
 units:[["1","1.6"],["1","1.5"],["1","10.0"]],
 title:"A Neanderthal pelvis and why men and women walk differently",
 gist:"Male Neanderthal pelvic geometry resembles that of modern human females; only modern human males show a forward-positioned acetabulum with shorter, thicker pubic bones, described as a shock-absorber and energy-return system for long-distance travel.",
 deploy:"Rak and Been's Scientific Reports study (2026) is a ready example for questions on skeletal changes due to erect posture, on Neanderthal morphology, and on how fossil anatomy illuminates living human variation. It gives Washburn's obstetrical dilemma a new twist.",
 news:"A study in Scientific Reports led by Professor Yoel Rak of Tel Aviv University with Professor Ella Been analysed two nearly complete male fossil pelves — one from Kebara Cave in Israel (excavated 1982) and one from Sima de los Huesos in Spain — against a comparative sample of 91 modern human pelves. Male Neanderthal pelvic geometry resembles that of modern human females: the hip joint sits farther back, with longer, thinner pubic bones. Modern human males alone show a forward-positioned acetabulum with shorter, thicker pubic bones. Rak describes the modern male pelvis as a perfect walking machine, suited to multi-day hunting journeys. The authors argue this male-specific adaptation evolved after Homo sapiens diverged from Neanderthals, while females retained the ancestral geometry because a narrower, forward-shifted architecture would compromise childbirth.",
 context:"Kebara Cave has been central to Neanderthal science since the 1982 discovery of Kebara 2, the most complete Neanderthal trunk skeleton known. Sima de los Huesos, the 'pit of bones' in Atapuerca, has yielded the largest accumulation of pre-Neanderthal hominin fossils in the world. The study joins a long tradition of reading locomotion, obstetrics and life history from pelvic form, running from Sir Arthur Keith through Washburn to modern biomechanics.",
 mechLabel:"Scientific mechanism",
 mech:"Bipedal walking loads the pelvis at every stride. Placing the acetabulum forward relative to the pubic bone changes the lever arms of the thigh musculature, so each footfall is cushioned and part of its energy returned, lowering the cost of long-distance travel. Because the same bony ring must also form the birth canal, any narrowing or repositioning carries obstetric consequences; selection therefore acted differently on the two sexes, producing dimorphism in gait visible today.",
 synth:[
  "The study descends directly from Washburn's obstetrical dilemma, the proposed trade-off between efficient bipedalism and safe childbirth. Here the dilemma is given a twist: males, freed from the obstetric constraint, evolved onward while females held the ancestral optimum.",
  "Erik Trinkaus and others long noted the broad Neanderthal pelvis; the finding that Neanderthal males resemble modern females cautions against treating 'archaic' and 'modern' as uniform packages — another instance of mosaic evolution."
 ],
 terms:[
  ["Obstetrical dilemma (Washburn)","The evolutionary compromise in which bipedalism favoured a narrow pelvis while encephalisation produced large-headed infants, restricting the birth canal, causing human babies to be born immature and requiring prolonged parental care."],
  ["Sexual dimorphism","Systematic morphological difference between males and females of a species; here expressed in acetabular position and pubic bone form."],
  ["Acetabulum","The cup-shaped socket of the hip joint; its antero-posterior position governs the mechanics of stride."],
  ["Energy-return system","A biomechanical arrangement in which elastic loading during one phase of movement is recovered in the next, reducing muscular cost."]
 ],
 scholars:["Yoel Rak","Ella Been","Sherwood Washburn","Arthur Keith","Erik Trinkaus"],
 communities:[],
 law:[],
 figures:["Two fossil pelves vs 91 modern pelves","Kebara 2 excavated 1982"]
},
{
 id:"sikkim", post:"p5", paper:"2",
 units:[["2","6.2"],["2","9.2"],["1","12.0"]],
 title:"Tribal-led rehabilitation in Sikkim: community answers to youth addiction",
 gist:"Peer-led rehabilitation centres run by ex-users carry much of Sikkim's response to drug dependency among 13–25 year olds, working through kin and community reintegration rather than clinical detoxification alone.",
 deploy:"Directly usable in Paper 2 answers on tribal health problems and in Paper 1 answers on medical and applied anthropology, as an Indian case of community-based healing. Frame with Kleinman's disease/illness distinction and Janzen's therapy management group.",
 news:"A report in The Indian Tribal documents how tribal-run rehabilitation centres are carrying much of Sikkim's response to a deepening drug problem, with users concentrated in the 13–25 age group. The Jeevan Marg Rehabilitation Centre at Ranipool, founded in 2005, houses 46 residents for stays of three to six months. The Freedom Recovery Centre at Tathangchen on Gangtok's outskirts, founded in 2015, holds 55 residents on a 120-day programme built around holistic mind-body healing.",
 context:"Sikkim has long had an unusual drug profile, with pharmaceutical opioids crossing the porous Bengal border. It responded with the Sikkim Anti Drugs Act, 2006, one of India's first state laws to treat users as candidates for care rather than only prosecution, well before the national Nasha Mukt Bharat Abhiyaan (2020). The peer-led centres described here grew in the space that legislation opened.",
 mechLabel:"Cultural mechanism",
 mech:"What makes these centres work is social, not merely clinical. Recovery is led by ex-users whose biographies certify that change is possible; residents live in a disciplined communal setting drawn from local Buddhist and tribal idioms of retreat and self-mastery; and families with the Drug Recovering Users' Network manage reintegration after discharge. In effect the community reabsorbs the addict as kin rather than expelling him as deviant, addressing the stigma and relapse cycle that clinical detoxification alone cannot touch.",
 synth:[
  "Medical anthropology gives the frame: Arthur Kleinman's distinction between disease (the pharmacological dependency) and illness (the lived, socially situated suffering), and John Janzen's therapy management group, the circle of kin and community that steers a patient's healing.",
  "As applied anthropology this is Sol Tax's action anthropology in practice — communities acting on their own problems with outside support."
 ],
 terms:[
  ["Therapy management group (Janzen)","The kin-based collective that takes charge of diagnosis and care; the family-and-peer scaffolding around each resident is its contemporary form."],
  ["Peer-led rehabilitation","Recovery programmes run by former users, whose experiential authority lowers stigma and improves retention."],
  ["Disease versus illness (Kleinman)","The separation of the biomedical condition from its social experience; effective treatment must address both."],
  ["Action anthropology (Tax)","Research that serves the studied community's own goals rather than only the researcher's."],
  ["Social reintegration","The managed return of a recovering person to family, work and community; the stage where relapse is won or lost."]
 ],
 scholars:["Arthur Kleinman","John Janzen","Sol Tax"],
 communities:[],
 law:["Sikkim Anti Drugs Act, 2006","Nasha Mukt Bharat Abhiyaan (2020)"],
 figures:["Users concentrated in 13–25 age group","Jeevan Marg: 46 residents; Freedom Recovery: 55 residents"]
},
{
 id:"languages", post:"p5", paper:"2",
 units:[["2","2.0"],["2","5.2"],["2","9.1"],["1","7.0"]],
 title:"National Conclave on Tribal Languages and Museums",
 gist:"A three-day national framework-setting conclave on documenting endangered unwritten tribal dialects, mother-tongue education, AI speech recognition for tribal tongues, and community-curated museums.",
 deploy:"Cite the 2026 MoTA National Conclave in Mysuru alongside CIIL linguistic mapping when discussing tribal education, language endangerment, cultural preservation, or museum anthropology. Link language loss to loss of ecological knowledge, not just to loss of words.",
 news:"The Ministry of Tribal Affairs organised a three-day National Conclave on Tribal Languages and Museums from 24–26 August 2026 in Mysuru, bringing together tribal scholars, linguists from the Central Institute of Indian Languages, Tribal Research Institutes and community elders. The conclave establishes a national framework for documentation of endangered unwritten tribal dialects, implementation of Mother Tongue-Based Multilingual Education, development of AI-based Automated Speech Recognition for tribal tongues, and expansion of community-curated Tribal Freedom Fighters Museums.",
 context:"India's tribal populations are custodians of hundreds of indigenous languages spanning four major families: Austroasiatic (Munda/Mon-Khmer), Dravidian (Gondi, Kurukh, Kui), Tibeto-Burman (Bodo, Mizo, Naga) and Indo-Aryan (Bhili). According to the People's Linguistic Survey of India, dozens of tribal mother tongues face severe endangerment through lack of written scripts, absence of native-tongue primary schooling, urban migration and dominant regional language hegemony.",
 mechLabel:"Policy mechanism",
 mech:"The conclave addresses three interconnected pillars. Mother-Tongue-Based Multilingual Education operationalises NEP 2020 guidelines so early schooling for tribal children occurs in the native mother tongue before transition to state and national languages, reducing primary dropout. Language technology builds standardised open-source speech-to-text and text-to-speech corpora for unwritten dialects, enabling digital literacy and service delivery without commercial exploitation or loss of community data sovereignty. Tribal museums shift from static colonial ethnographic display towards dynamic, community-curated living museums.",
 synth:[
  "Linguistic relativity (the Sapir-Whorf hypothesis): language is not merely a communication tool but an interpretive prism shaping worldview. The extinction of a tribal dialect means irreversible loss of unique cognitive taxonomies and botanical knowledge.",
  "Decolonising ethnographic curation: museum theory now holds that indigenous communities must have primary curatorial voice over their own artefacts, replacing exoticised colonial explanation with living cultural representation."
 ],
 terms:[
  ["Mother-Tongue-Based Multilingual Education (MTB-MLE)","Pedagogy in which primary schooling begins in the child's native mother tongue to build cognitive foundations, with gradual introduction of regional and national languages."],
  ["Language endangerment and language shift","The process by which a linguistic community gradually abandons its ancestral language for a dominant regional or national one under socio-economic pressure."],
  ["Ethno-linguistics","The study of the relationship between language and culture, exploring how ethnic groups perceive phenomena through their linguistic structures."],
  ["Community-curated museology","A participatory approach in which indigenous communities select, interpret and present their own artefacts, oral histories and struggles."],
  ["Linguistic relativity (Sapir-Whorf)","The proposition that the structure of a language shapes the worldview and cognition of its speakers."]
 ],
 scholars:["Edward Sapir","Benjamin Lee Whorf","G.N. Devy (PLSI)"],
 communities:["Munda","Gond","Bodo","Bhil"],
 law:["NEP 2020","People's Linguistic Survey of India"],
 figures:["24–26 August 2026, Mysuru","Four language families among tribal India"]
}

{
 id:"stonethrow", post:"p6", paper:"1",
 units:[["1","1.5"],["1","7.0"],["1","5.0"]],
 title:"Why chimpanzees keep throwing stones at the same trees",
 gist:"Adult male chimpanzees in Guinea-Bissau repeatedly hurl rocks at particular trees, building lasting stone piles at their bases, some targeted for over a decade — a candidate for non-utilitarian tradition with no obvious subsistence payoff.",
 deploy:"Cite Nakano and Kalan's Boé fieldwork (2026) with Kühl et al. (2016) as the baseline, when answers on primate behaviour or the culture concept need a current example of possible non-human symbolic behaviour. Use 'proto-ritual' with care — it is a contested label.",
 news:"Fieldwork by primatologists Robyn Nakano and Ammie Kalan (University of Victoria), first published in The Conversation in June 2026 and recirculated on 26 August, documents 'accumulative stone throwing' among unhabituated savanna chimpanzees in Boé National Park, Guinea-Bissau. Adult males repeatedly hurl rocks at particular trees, producing lasting stone piles; some trees have been targeted for over a decade. The throws are accompanied by pant-hoot calls and buttress drumming, and the behaviour is known from only four West African chimpanzee populations, although suitable rocks and trees are available across the species' range.",
 context:"Accumulative stone throwing was first described in 2016 by Hjalmar Kühl and colleagues of the Pan African Programme, who recorded it in Guinea-Bissau, Guinea, Ivory Coast and Liberia and provoked a debate, sometimes caricatured as the 'sacred trees' question, about whether the piles are proto-ritual. The new fieldwork adds longevity and richer behavioural context. It extends the lineage of primate culture research that began with Goodall's 1960 observation of termite-fishing at Gombe and Japanese primatologists' documentation of sweet-potato washing among Koshima macaques.",
 mechLabel:"Scientific mechanism",
 mech:"The restriction of the behaviour to four populations despite the raw materials being widely available is the crucial datum. Where ecology cannot explain a behavioural difference between groups, social learning can, and that is the operational test of culture in primatology. Video showed the throws embedded in male display sequences; a stone striking a hollow buttress produces a low-frequency sound carrying farther than the call alone, and the accumulating pile may serve as a durable visual marker at key locations.",
 synth:[
  "The finding belongs to the primate culture debate associated with Whiten, McGrew and Christophe Boesch, whose 1999 Nature synthesis catalogued 39 behavioural variants across chimpanzee communities best explained by social transmission. Accumulative stone throwing is a strong addition because it has no obvious subsistence payoff.",
  "It also disciplines our talk of ritual. Durkheim tied ritual to collective representations; if chimpanzee stone piles mark places without referential meaning, they sit at the boundary anthropologists draw between behavioural tradition and symbol — sharpening, rather than dissolving, the question of what made human symbolism different."
 ],

  ["Pant-hoot","The chimpanzee long-distance call, here coupled with stone throws and buttress drumming into a compound display."],

{
 id:"sleep", post:"p6", paper:"1",
 units:[["1","1.4"],["1","9.8"],["1","11.0"]],
 title:"Evolutionary sleep ecology: what hunter-gatherer sleep tells us about circadian adaptation",
 gist:"Actigraphy across the Hadza, San and Tsimane finds natural human sleep averaging 5.7 to 7.1 hours, modulated by ambient temperature and social vigilance rather than light alone — challenging the 'mandatory eight consolidated hours' as a biological baseline.",
 deploy:"Cite the 2026 Brain Medicine hunter-gatherer sleep study (Hadza, San, Tsimane) when writing on human ecological adaptation, biocultural evolution, or evolutionary medicine. The framing concept is evolutionary mismatch.",
 news:"A review published in Brain Medicine on 25 August 2026 synthesises phylogenomic data and ethnographic fieldwork across contemporary pre-industrial societies including the Hadza of Tanzania, the San/Ju/'hoansi of the Kalahari, and the Tsimane of the Bolivian Amazon. It reports that natural human sleep architecture averages between 5.7 and 7.1 hours per night, modulated by ambient environmental temperature and social vigilance rather than by artificial light-dark cycles alone, challenging the industrial assumption of a mandatory eight-hour consolidated sleep.",
 context:"Modern clinical and popular assumptions treat unbroken eight-hour night sleep as the biologically natural baseline, diagnosing deviations as pathology. Evolutionary anthropologists instead investigate sleep as a behavioural and physiological adaptation shaped by ancestral hominin life in tropical savannahs — open-air encampments exposed to seasonal temperature shifts, nighttime predators and communal sleeping arrangements.",
 mechLabel:"Scientific mechanism",
 mech:"Using actigraphy — non-invasive monitoring of rest and activity cycles with a wearable motion sensor — and phylogenomic sleep-gene sequencing, researchers found that hunter-gatherers rarely sleep at sunset; they remain active around communal fires for several hours, storytelling and bonding. Sleep onset correlates with nocturnal temperature decline rather than darkness alone. Sleep features natural nocturnal awakenings, high sleep efficiency with insomnia prevalence under 2 per cent, and seasonal variation of about an hour longer in winter — phenotypic plasticity in circadian rhythms.",
 synth:[
  "Evolutionary mismatch theory explains modern sleep disorders as arising from the gap between ancestral adaptive physiology (temperature cues, communal security) and the modern artificial environment (climate control, isolated bedrooms, screen exposure).",
  "Sleep emerges as a bio-cultural institution structured by cultural habit, communal security and ecological pressure, not merely an automatic biological state."
 ],
 terms:[
  ["Evolutionary mismatch theory","The concept that traits adaptive in an ancestral environment become maladaptive in a rapidly transformed modern one."],
  ["Circadian entrainment","Synchronisation of an organism's internal 24-hour clock with external cues such as temperature oscillation and daylight."],
  ["Phenotypic plasticity","The ability of a single genotype to produce different physiological or behavioural phenotypes under varying environmental conditions."],
  ["Sleep architecture","The structural organisation of sleep cycles, including the distribution of NREM and REM sleep across the night."],
  ["Actigraphy","Non-invasive objective monitoring of rest and activity cycles over extended periods using a wearable motion sensor."]
 ],
 scholars:[],
 communities:["Hadza","San / Ju/'hoansi","Tsimane"],
 law:[],
 figures:["5.7–7.1 hours average sleep","Insomnia prevalence under 2%","~1 hour longer sleep in winter"]

{
 id:"yindjibarndi", post:"p6", paper:"1",
 units:[["1","4.0"],["1","1.1"],["2","6.3"],["2","7.1"]],
 title:"Yindjibarndi native title appeal: compensating spiritual injury",
 gist:"An Aboriginal corporation appealed a AUD 150 million mining compensation ruling, seeking over AUD 1.3 billion on the argument that compensation must account primarily for irreversible spiritual and cultural injury, not commercial land value.",
 deploy:"An excellent global comparative case for Paper 1 on indigenous rights and globalisation, and for Paper 2 alongside Niyamgiri — both turn on whether a sacred landscape can be valued in money or must be decided by the community itself.",
 news:"In an appeal before the Federal Court of Australia on 25–26 August 2026, the Yindjibarndi Aboriginal Corporation appealed a court-ordered AUD 150 million mining compensation ruling against Fortescue Metals Group in Western Australia's Pilbara region. The community seeks over AUD 1.3 billion, asserting that statutory compensation for native title extinguishment must account not only for commercial land value but primarily for the severe, irreversible spiritual and cultural injury caused by open-cut destruction of sacred songlines, ancestral waterholes and burial grounds without their free, prior and informed consent.",
 context:"Across post-colonial settler nations — Australia, Canada, New Zealand — modern legal frameworks struggle to evaluate indigenous relationships with land. Western property law views land primarily as a divisible economic commodity; indigenous jurisprudence treats it as an indivisible sacred matrix woven together by ancestral tracks, totemic spirits and customary stewardship responsibilities.",
 mechLabel:"Legal mechanism",
 mech:"Following the Timber Creek precedent (2019), Australian native title jurisprudence recognised that compensation for acts impairing or extinguishing native title must include a distinct head of damages for spiritual loss — intangible cultural harm. The Yindjibarndi appeal challenges how courts quantify the destruction of sacred sites when mining operates on ancestral estates without community consent, establishing precedents relevant to UNDRIP Article 28.",
 synth:[
  "Sacred landscape and ontological pluralism: indigenous land tenure is rooted in relational ontology, where human identity, spiritual life and physical geography are co-constitutive.",
  "Legal pluralism and subaltern justice: the persistent difficulty of translating non-monetisable spiritual grief and cultural trauma into monetary compensation within formal state courts.",
  "Read against Niyamgiri (2013), where the Indian Supreme Court avoided the valuation problem entirely by handing the decision to the gram sabhas — a different answer to the same question."
 ],
 terms:[
  ["Native title","Legal recognition under common law that indigenous peoples hold customary rights and interests in land and waters derived from their traditional laws and customs."],
  ["Spiritual loss / intangible cultural harm","Non-economic, emotional and cultural damage suffered when sacred sites, ancestral connections or ritual obligations to land are severed or destroyed."],
  ["Relational ontology","The perspective that entities — humans, animals, spirits, landscape — exist and derive meaning through reciprocal relationships with one another."],
  ["UNDRIP Article 28","The provision guaranteeing indigenous peoples redress, restitution or fair compensation for lands and resources confiscated or damaged without free, prior and informed consent."],
  ["Songline","An ancestral track across country encoded in song, mapping sacred geography and law; damage to one point damages the whole."]
 ],
 scholars:[],
 communities:["Yindjibarndi","Dongria Kondh (comparison)"],
 law:["Timber Creek precedent (2019)","UNDRIP Article 28","Orissa Mining Corporation v. MoEF (2013)"],
 figures:["AUD 150 million awarded; AUD 1.3 billion sought"]
