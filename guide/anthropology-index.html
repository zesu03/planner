{
 id:"mencher", post:"p6", paper:"2",
 units:[["2","4.0"],["2","3.2"],["1","6.0"],["2","5.1"]],
 title:"Joan P. Mencher (1930–2026): anthropologist of caste and the Kerala countryside",
 gist:"The death of the American anthropologist whose half-century of village fieldwork produced the sharpest materialist reading of caste — the view from the bottom, where hierarchy looks like economic exploitation that keeps the exploited divided.",
 deploy:"Cite Mencher (Current Anthropology, 1974) against Dumont in any answer on caste theory, and her passing when a question touches the growth of anthropology in India or the ethics of long-term fieldwork. Teaching caste theory without Mencher leaves Dumont unanswered.",
 news:"Joan P. Mencher died in New York on 7 August 2026, aged 96; the Economic and Political Weekly carried a full tribute by A.M. Jose and Jos Chathukulam on 29 August 2026. Trained at Columbia and a professor at Lehman College and the CUNY Graduate Center, she began in the ethnography of Kerala kinship — the Nayar taravad and the marriage rules of the Namboodiri Brahmins — and moved steadily towards agrarian political economy: agricultural labourers in Palakkad and Chingleput, the position of Dalits, and the work of women in rice cultivation. Her most cited essay, 'The Caste System Upside Down, or The Not-So-Mysterious East' (Current Anthropology, 1974), asked what caste looks like from the bottom and answered that it looks like a system of economic exploitation that keeps the exploited divided. Her later work included Life as a Dalit: Views from the Bottom on Caste in India (with Subhadra Mitra Channa, 2013).",
 context:"Mencher belonged to the post-war cohort of American anthropologists who made India a fieldwork discipline rather than a textual one, alongside Kathleen Gough, with whom she shared both Kerala and a materialist bent. Her Namboodiri and Nayar studies joined the classic Kerala kinship literature; her agrarian work ran parallel to the land reform decades in Kerala and Tamil Nadu, and her data on who actually transplants, weeds and harvests fed the case for recognising women as farmers.",
 mechLabel:"Theoretical mechanism",
 mech:"The methodological move is the 'view from below': describe an institution from the position of those it subordinates, and the appearance of consensus dissolves. Where a view from the top sees a shared ideology of purity ordering society, a view from the bottom sees labour extraction organised so that those who bear it cannot combine. The two descriptions are of the same system; the difference is the standpoint of the observer.",
 synth:[
  "Her 1974 essay is the standard materialist counterpoint to Louis Dumont's Homo Hierarchicus: where Dumont found an ideology of purity ordering consensual hierarchy, Mencher, like Gerald Berreman, argued the view from the bottom dissolves the appearance of consensus.",
  "Her trajectory from kinship to political economy mirrors the discipline's own movement in the 1970s towards Marxist anthropology, and her applied turn — women in agriculture and sustainable farming — is a working example of action anthropology in Sol Tax's sense."
 ],
 terms:[
  ["View from below","The methodological insistence that a social institution be described from the position of those it subordinates; Mencher's signature contribution to caste studies."],
  ["Materialist analysis of caste","The reading of caste as a system organising labour and surplus extraction, against purely ideological or ritual accounts."],
  ["Taravad","The Nayar matrilineal joint family estate of Kerala, a staple of kinship theory and one of Mencher's early subjects."],
  ["Agrarian political economy","The study of how land, labour and credit relations structure rural society."],
  ["Homo Hierarchicus (Dumont)","The structuralist account of caste as an ideology of purity and pollution ordering a consensual hierarchy — the position Mencher and Berreman contest."]
 ],
 scholars:["Joan P. Mencher","Louis Dumont","Gerald Berreman","Kathleen Gough","Sol Tax","Subhadra Mitra Channa"],
 communities:["Nayar","Namboodiri","Dalit"],
 law:[],
 figures:["Died 7 August 2026, aged 96","'The Caste System Upside Down', Current Anthropology, 1974"]
},
{
 id:"seedbank", post:"p6", paper:"2",
 units:[["2","9.2"],["1","3.0"],["2","6.2"],["2","3.3"]],
 title:"A seed bank in Sundargarh: Suratha Kisan's 110 rice varieties",
 gist:"An Adivasi farmer's community seed bank conserving over 110 indigenous rice landraces runs on a loan-and-return rule with increment, so the stock grows as it circulates — indigenous knowledge as climate adaptation.",
 deploy:"Cite Suratha Kisan's Singha Bahini Seed Bank (Sundargarh, 2026) and the Koraput GIAHS as running examples of indigenous knowledge serving climate adaptation and development from below. The cost figures are concrete: ₹3,000–4,000 per acre against ₹6,000–8,000 for HYVs.",
 news:"The Indian Tribal reported the work of Suratha Kisan, an Adivasi farmer of Sundargarh district, Odisha, whose community seed bank now conserves more than 110 indigenous rice varieties alongside 18 millet varieties, 6 pulses, 10 vegetables and 2 oilseeds. He began in 2014–15 with 35 rice landraces and founded the Singha Bahini Seed Bank with support from the Desi Bihaana Suraksha Manch. The bank runs on a loan-and-return rule: a farmer borrows seed and returns the borrowed quantity with a surplus after harvest, so the stock grows as it circulates, and about 80 farmers now participate. Cultivating these landraces costs roughly ₹3,000–4,000 an acre against ₹6,000–8,000 for high-yielding varieties with their fertiliser and pesticide load, and the desi varieties tolerate drought and pests that damage HYVs.",
 context:"The Green Revolution's high-yielding package, spreading from the late 1960s, displaced thousands of locally adapted rice landraces; Odisha, and especially its tribal tracts, remained a refuge of diversity. The Jeypore tract of Koraput is considered a centre of origin of cultivated rice, the Koraput system was recognised by FAO as a Globally Important Agricultural Heritage System in 2012, and Kamala Pujari of Koraput, honoured with the Padma Shri in 2019, made the conserving Adivasi woman farmer a national figure. India's legal scaffolding includes the Protection of Plant Varieties and Farmers' Rights Act, 2001.",
 mechLabel:"Scientific and institutional mechanism",
 mech:"Landraces are genetically heterogeneous populations shaped by generations of farmer selection in local soils, rainfall and pest regimes. That heterogeneity is a buffer: some plants in a stand will tolerate the drought or pest that devastates a genetically uniform HYV field, and the varieties need little purchased input because they are matched to local fertility. The seed bank's loan-with-increment rule is the institutional mechanism, keeping seed viable through annual regeneration in farmers' fields — in situ, on-farm conservation — rather than in a cold vault, and binding members through obligation to return.",
 synth:[
  "Traditional Ecological Knowledge in Fikret Berkes's sense: a cumulative body of knowledge, practice and belief about living things, evolving by adaptive management and handed down culturally.",
  "Julian Steward's cultural ecology would read the landrace portfolio as the cultural core of a community adapted to a specific environment.",
  "Marcel Mauss: seed given creates the obligation to return with increment, and the surplus is social as much as agronomic, enrolling 80 households into a moral economy of shared insurance."
 ],
 terms:[
  ["Landrace","A locally adapted, genetically variable crop population maintained by farmer selection rather than formal breeding."],
  ["Traditional ecological knowledge (TEK)","Berkes's term for the inherited, evolving knowledge-practice-belief complex linking a community to its ecosystem."],
  ["Seed sovereignty","A community's control over its own seed supply, exchange and reuse, as against dependence on purchased proprietary seed."],
  ["In situ / on-farm conservation","Maintaining crop diversity in the fields and communities where it evolved, as opposed to ex situ storage in gene banks."],
  ["GIAHS","FAO's designation for Globally Important Agricultural Heritage Systems, held by Koraput's traditional agriculture since 2012."]
 ],
 scholars:["Fikret Berkes","Julian Steward","Marcel Mauss","Kamala Pujari"],
 communities:["Adivasi (Sundargarh)"],
 law:["Protection of Plant Varieties and Farmers' Rights Act, 2001","GIAHS designation (2012)"],
 figures:["110+ rice varieties; 18 millets, 6 pulses, 10 vegetables, 2 oilseeds","Began 2014–15 with 35 landraces","~80 participating farmers","₹3,000–4,000/acre vs ₹6,000–8,000 for HYVs"]
},

{
 id:"nilgiri", post:"p7", paper:"2",
 units:[["2","6.1"],["2","3.2"],["1","3.0"],["2","7.2"]],
 title:"Nilgiri tribal complex: Toda, Kota, Kurumba and Irula",
 gist:"The most formalised inter-tribal symbiosis in South Asia — pastoral Toda, artisan-musician Kota, forest-dwelling Kurumba sorcerers and marginal Irula — bound by ecological complementarity, occupational specialisation and ritual interdependence.",
 deploy:"The standing comparison with the plains jajmani system, but rooted in tribal rather than caste relations. Use it to show that functional interdependence does not require caste hierarchy. Under market integration the symbiosis shifted from mutual interdependence to competitive co-existence.",
 news:"The Toda, Kota, Kurumba and Irula, alongside the immigrant Badaga agriculturalists, formed a tightly interlocked socioeconomic system in the Nilgiri Hills of Tamil Nadu. W.H.R. Rivers, in The Todas (1906), first brought the system to scholarly attention, and Paul Hockings later documented its transformation under modernity.",
 context:"The Toda occupied the plateau grasslands and were exclusively pastoral, maintaining sacred and ordinary buffalo herds, supplying ghee, milk and butter and receiving grain, crafts and ritual services in return. The Kota were the artisan-musicians, producing iron tools, pottery and leather goods and performing music at Toda and Badaga funerary and ceremonial occasions — an obligation simultaneously economic and cosmological. The Kurumba of the deep forests combined forest collection with a critical ritual niche, feared as sorcerers whose protective and curative services were indispensable, maintained through hereditary patron-client ties. The Irula occupied forest margins and lower slopes, supplying game, forest produce and seasonal agricultural labour.",
 mechLabel:"Cultural and economic mechanism",
 mech:"Each group occupied a distinct altitudinal and ecological niche, and none was self-sufficient. Exchange was not merely transactional but ritually embedded, which made the bonds culturally inalienable — a Kota could not simply decline to play at a Toda funeral. The system dissolved along several fronts at once: colonial plantation agriculture disrupted Toda grazing lands, mass-produced goods eroded the Kota artisan monopoly, modernisation and Christianisation weakened belief in Kurumba sorcery, and forest legislation marginalised Irula livelihoods.",
 synth:[
  "Mandelbaum observed that exchange within this system was ritually embedded rather than merely transactional, making inter-tribal bonds culturally inalienable.",
  "The Nilgiri case shows how ecological differentiation, occupational specialisation and ritual complementarity can sustain a self-regulating exchange network among tribal communities without caste hierarchy — and how market integration, land alienation, formal education and conservation law convert symbiosis into competition."
 ],
 terms:[
  ["Inter-tribal symbiosis","A durable exchange system in which neighbouring tribal groups occupy complementary ecological and occupational niches and depend on one another."],
  ["Ritual embedding","The condition in which economic exchange is inseparable from ritual obligation, so that withdrawal from trade is also withdrawal from cosmological order."],
  ["Jajmani parallel","The comparison with the plains caste-based patron-client system; useful precisely because the Nilgiri system achieves similar interdependence without caste."],
  ["Competitive co-existence","The post-integration condition in which formerly interdependent groups compete for the same welfare entitlements, land and wage labour."]
 ],
 scholars:["W.H.R. Rivers","Paul Hockings","David Mandelbaum","M.B. Emeneau","B.H. Bhanu"],
 communities:["Toda","Kota","Kurumba","Irula","Badaga"],
 law:["Forest legislation"],
 figures:["Rivers, The Todas (1906)"]
},
{
 id:"centralindia", post:"p7", paper:"2",
 units:[["2","6.1"],["1","3.0"],["2","3.3"],["2","6.2"]],
 title:"Central India complex: Gond, Baiga, Agaria and Pardhan",
 gist:"A forest-economy web in the Satpura and Maikala ranges — dominant Gond agriculturalists, iron-smelting Agaria, priestly Baiga who refuse the plough, and bardic Pardhan who keep Gond genealogy in song.",
 deploy:"The clean structural parallel to the Nilgiri complex: iron-smelter, ritual agriculturalist, sorcerer-priest and bard producing durable mutual dependence without formal caste hierarchy. Elwin is the primary source throughout.",
 news:"The forested highlands of Madhya Pradesh and Chhattisgarh host a web of inter-tribal interdependence among the Gond, Baiga, Agaria and Pardhan, documented extensively by Verrier Elwin, bearing a remarkable structural resemblance to the Nilgiri complex.",
 context:"The Gond, numerically and politically dominant in central India, were primarily agriculturalists and forest dwellers who maintained hereditary relationships with specialist communities. The Agaria, a small iron-smelting tribe, occupied a niche functionally identical to the Kota, extracting ore from the Maikala range and producing ploughshares, axes, sickles and mattocks; Elwin documented their profound ritual relationship with iron, arguing they were custodians of a sacred metallurgical tradition rather than merely blacksmiths. The Baiga, recognised by the Gond and Kol as the most ancient inhabitants of the region, were respected as priests with special knowledge of soil and forest, practised bewar (slash-and-burn) and refused the plough as a matter of cosmological principle. The Pardhan were the bardic community — oral historians, genealogists and musicians of the Gond — receiving grain, land-use rights and gifts in return.",
 mechLabel:"Cultural and economic mechanism",
 mech:"No single group was economically self-sufficient, and the specialisations were simultaneously technical and cosmological: the Agaria's iron carried ritual meaning, the Baiga's refusal of the plough was a religious position with agricultural consequences, and the Pardhan's songs were the Gond's only archive. Colonial land settlement, forest reservation and the push toward settled agriculture — particularly the forced settlement of the Baiga — disrupted these interdependencies at the root.",
 synth:[
  "Elwin observed that these relationships were not mere economic transactions but expressions of a shared cosmological order in which each community had a defined place.",
  "The erosion of this system under colonial and post-colonial development policy underscores the anthropological cost of development that ignores indigenous social architecture."
 ],
 terms:[
  ["Bewar","Slash-and-burn shifting cultivation practised by the Baiga, whose refusal to use the plough rested on the belief that it wounds the earth."],
  ["Bardic specialisation","The hereditary role of maintaining and transmitting another community's mythology and genealogy through song, as the Pardhan did for the Gond."],
  ["Sacred metallurgy","The ritual relationship between the Agaria and iron, in which smelting is a cosmological as well as technical act."],
  ["Occupational niche","A specialised economic role occupied by one community within a wider exchange system, generating dependence in both directions."]
 ],
 scholars:["Verrier Elwin","W.V. Grigson","Stephen Fuchs","Shamrao Hivale"],
 communities:["Gond","Baiga","Agaria","Pardhan","Kol"],
 law:["Colonial forest reservation"],
 figures:["Elwin, The Baiga (1939); The Agaria (1942)","Grigson, The Maria Gond (1938)"]
},
{
 id:"chotanagpur", post:"p7", paper:"2",
 units:[["2","6.1"],["2","3.2"],["2","8.2"],["2","6.2"]],
 title:"Chota Nagpur complex: Santal, Munda, Ho, Oraon and Birhor",
 gist:"Settled agriculture, forest foraging, artisan production and ritual service distributed across distinct communities on the Chota Nagpur plateau, with the Birhor in an asymmetric hereditary exchange resembling the jajman-kamin bond.",
 deploy:"The disintegration of this system under colonial forest policy, diku migration and missionary influence precipitated the Santal Hul (1855–56) and the Munda Ulgulan (1899–1900) — the link that lets you argue displacement of indigenous economy produces existential crisis, not merely poverty.",
 news:"The Chota Nagpur Plateau of Jharkhand and contiguous Odisha and West Bengal is home to one of India's most densely tribal regions, where the Santal, Munda, Ho, Oraon, Birhor, Lohar and Mahali maintained structured interdependence. S.C. Roy documented these relationships in detail.",
 context:"The Munda and Ho were the dominant agricultural communities of the upland plateau, cultivating rice and millets under the khuntkatti joint ownership land tenure. The Santal, on the eastern and lowland margins, were agriculturalists with a strong tradition of forest clearance and settlement. The Birhor, semi-nomadic hunters and rope-makers, occupied the most specialised niche, supplying rope from forest creepers, monkey meat and forest medicines to agricultural tribes in exchange for grain and cooked food. The Mahali were basket-makers. The Lohar, technically a caste group, functioned within the tribal exchange network by providing iron tools — a blurring of the tribe-caste boundary.",
 mechLabel:"Cultural and economic mechanism",
 mech:"The Birhor exchange was hereditary and personalised, resembling the jajman-kamin bond, but asymmetric: the forager depended on the cultivator more than the reverse. Colonial extraction of forest resources, the zamindari system and the influx of non-tribal dikus progressively marginalised the Birhor and disrupted the Mahali's artisan role — both communities are now classified as PVTGs, which is the long-term consequence of ignoring traditional livelihoods.",
 synth:[
  "The Lohar's position inside a tribal network illustrates what N.K. Bose theorised as the 'Hindu method of tribal absorption'.",
  "Functional interdependence, ritual complementarity and hereditary exchange partnerships are not exclusive to the plains jajmani model but emerge naturally within tribal ecologies.",
  "The destruction of these arrangements produced not merely economic deprivation but existential crisis, which is why the Santal Hul and Munda Ulgulan followed."
 ],
 terms:[
  ["Khuntkatti","The Munda system of joint village land ownership by the descendants of the original clearing lineage."],
  ["Diku","Outsider or non-tribal migrant in Chota Nagpur usage; the influx of dikus under colonial land settlement is central to the region's revolts."],
  ["Jajman-kamin bond","The hereditary, personalised patron-client relationship of the plains jajmani system, paralleled in the Birhor's exchange with agricultural tribes."],
  ["Ulgulan","The 'great tumult' — Birsa Munda's rising of 1899–1900 against land alienation and missionary and colonial authority."],
  ["Santal Hul","The Santal rebellion of 1855–56 against moneylenders, zamindars and colonial administration."]
 ],
 scholars:["S.C. Roy","K.S. Singh","L.P. Vidyarthi","N.K. Bose","W.G. Archer"],
 communities:["Santal","Munda","Ho","Oraon","Birhor","Mahali","Lohar"],
 law:["Zamindari system","PVTG classification"],
 figures:["Roy, The Mundas (1912); The Birhors (1925)","Santal Hul 1855–56; Munda Ulgulan 1899–1900"]
},
{
 id:"apatani", post:"p7", paper:"2",
 units:[["2","6.1"],["1","3.0"],["1","4.0"],["2","7.3"]],
 title:"Northeast India: Apa Tani, Nishi and Hill Miri",
 gist:"Ecological asymmetry — an exceptionally productive valley producing rice surplus against forest-dependent swidden neighbours — generated formal inter-community trade institutions including the poge debt-bondage system and mithun peace pacts.",
 deploy:"The case that ecological advantage can generate formal inter-ethnic trade institutions, including debt bondage, without any caste framework. Von Fürer-Haimendorf's Apa Tani work shows tribal societies developing complex surplus economies through endogenous institutional innovation.",
 news:"The Subansiri district of Arunachal Pradesh presents a structured system of inter-ethnic interdependence involving the Apa Tani, Nishi (Dafla) and Hill Miri. Christoph von Fürer-Haimendorf, who conducted fieldwork among the Apa Tani in the 1940s, documented a sophisticated system of trade, barter, debt bondage and peace-pact diplomacy.",
 context:"The Apa Tani occupied a small valley of extraordinary agricultural productivity, practising intensive wet rice cultivation with elaborate irrigation channels and fish-cum-paddy cultivation — among the most sophisticated forms of tribal agriculture documented in South Asia. Despite a population of approximately 15,000, they produced a rice surplus the surrounding Nishi and Hill Miri, forest-dependent swidden cultivators, could not match. The Nishi supplied forest products — wild game, timber, thatch — and, critically, debt bondspeople (poge), in exchange for rice, iron tools, brass ornaments and cotton cloth. The Hill Miri maintained a more balanced relationship with both, acting as intermediaries.",
 mechLabel:"Economic and political mechanism",
 mech:"The ecological asymmetry formed the basis of exchange. The poge system was a formalised institution of debt-bondage in which Nishi individuals in economic distress entered temporary service in Apa Tani households, with defined rights and obligations on both sides. Peace pacts, formalised through mithun exchange ceremonies, created mechanisms for conflict resolution between communities. The Apa Tani surplus also enabled accumulation of wealth in brass plates, beads and mithun cattle — a prestige economy structuring internal social hierarchy.",
 synth:[
  "Von Fürer-Haimendorf's analysis shows tribal societies developing complex economies of surplus and exchange through endogenous institutional innovation, not diffusion from state societies.",
  "Post-independence administrative integration, abolition of the poge system and road connectivity fundamentally altered these dynamics, raising questions about the pace and cultural sensitivity of development in ecologically and socially distinct regions."
 ],
 terms:[
  ["Poge","The formalised Apa Tani-Nishi debt-bondage institution in which individuals in economic distress entered temporary service with defined rights and obligations."],
  ["Mithun exchange","Ceremonial transfer of mithun cattle formalising peace pacts and conflict resolution between communities."],
  ["Prestige economy","An economic system in which accumulated valuables — brass plates, beads, mithun — confer status and structure social hierarchy."],
  ["Swidden cultivation","Shifting cultivation clearing and burning forest patches, contrasted here with Apa Tani intensive wet rice."],
  ["Fish-cum-paddy cultivation","The Apa Tani practice of raising fish in irrigated rice fields, raising productivity from a single plot."]
 ],
 scholars:["Christoph von Fürer-Haimendorf","Verrier Elwin","Tamo Mibang","Stuart Blackburn"],
 communities:["Apa Tani","Nishi (Dafla)","Hill Miri"],
 law:["Abolition of the poge system"],
 figures:["Apa Tani population ~15,000","Von Fürer-Haimendorf, The Apa Tanis and Their Neighbours (1962)"]
},
{
 id:"wayanad", post:"p7", paper:"2",
 units:[["2","6.1"],["2","3.2"],["2","7.1"],["2","6.2"]],
 title:"Wayanad complex: Kurichiya, Paniya and Kurumba",
 gist:"A layered system distinguished from the Nilgiri model by explicit hierarchy and institutionalised bondage — dominant Kurichiya cultivators, Paniya agricultural labourers bound under the adima system, and forest-dwelling Kurumba.",
 deploy:"The sharpest available case for the paradox of legal emancipation: the Paniya's transition from bonded labourers to free wage workers was a legal liberation that produced economic vulnerability. Dissolution of interdependence, even by progressive law, requires simultaneous investment in alternative livelihoods.",
 news:"The Wayanad plateau of northern Kerala presents a layered pattern of inter-tribal interdependence, geographically proximate to but structurally distinct from the Nilgiri system. P.R.G. Mathur and K. Raman Unni documented these relationships within the broader frame of tribal social organisation in Kerala.",
 context:"The Kurichiya occupied the dominant position: primary cultivators practising wet rice and dry crop agriculture with rights over fertile valley land, characterised by strong community cohesion, hereditary headmen and a martial tradition giving them political leverage. The Paniya, whose name derives from the Malayalam for work (pani), occupied structural subordination as agricultural labourers, historically bound to Kurichiya and non-tribal Nair landlords under the adima system — hereditary bonded labour unique to Kerala's hill tracts. The Kurumba, specifically the Mullu and Betta Kurumba, occupied the deep forests, providing honey, forest produce, medicinal plants and ritual services including sorcery to both communities.",
 mechLabel:"Economic and legal mechanism",
 mech:"The adima relationship, while economically exploitative, carried obligations of patron-client care: residence rights on the landowner's premises, food and minimal wages. Abolition through the Kerala Agricultural Workers Act (1974) and the Bonded Labour System (Abolition) Act (1976) removed the exploitation and the security together. Simultaneously, forest conservation regulations constrained Kurumba forest access while Kurichiya lands faced encroachment from migrant settlers. Competition for welfare entitlements, land rights and wage labour has replaced complementary exchange.",
 synth:[
  "Wayanad is distinguished from the Nilgiri model by the explicit presence of social hierarchy and institutionalised labour bondage alongside economic complementarity.",
  "The Paniya's transition from bonded labourer to free wage worker is a legal emancipation that paradoxically produced economic vulnerability — the case for pairing rights-based reform with livelihood investment."
 ],
 terms:[
  ["Adima","Hereditary bonded labour unique to Kerala's hill tracts, binding Paniya labourers to Kurichiya and Nair landlords."],
  ["Patron-client care","The reciprocal obligations of protection, residence and subsistence embedded in exploitative bonded relationships, lost when the bond is abolished without replacement."],
  ["Structural subordination","A position of durable inequality within an exchange system, as distinct from simple poverty."],
  ["Legal emancipation paradox","The outcome in which abolishing an exploitative institution removes the security it also provided, leaving the freed worse off in the short run."]
 ],
 scholars:["P.R.G. Mathur","K. Raman Unni","B.H. Bhanu","K.K.N. Kurup"],
 communities:["Kurichiya","Paniya","Kurumba (Mullu, Betta)","Kattunayakan","Adiya","Nair"],
 law:["Kerala Agricultural Workers Act, 1974","Bonded Labour System (Abolition) Act, 1976"],
 figures:[]

{
 id:"forensic", post:"p8", paper:"1",

 title:"Enforced disappearances and the work of forensic anthropology",
 gist:"The International Day of the Victims of Enforced Disappearances is the cleanest hook for forensic anthropology — the science that answers the families' central question, where is my relative and what happened to them.",
 deploy:"The EAAF's identification programme in Argentina and the ICMP's DNA-led identifications after Srebrenica are ready examples for any Paper 1 answer on the applications of physical anthropology. Clyde Snow called the skeleton a witness that does not forget.",
 news:"On 30 August 2026 the UN and human rights organisations marked the International Day of the Victims of Enforced Disappearances, proclaimed by UNGA resolution 65/209 of 21 December 2010 and observed since 2011. The International Commission on Missing Persons, created in 1996 to trace persons missing from the Yugoslav wars, issued a statement recalling that enforced disappearance remains a live practice on several continents and that scientific identification of the missing is both a legal obligation and a form of reparation to families.",
 context:"The observance grew out of Latin America's experience of state terror. FEDEFAM, the federation of associations of relatives of the detained-disappeared founded in Costa Rica in 1981, first marked 30 August as a day of protest and remembrance. Forensic anthropology entered this history in 1984, when Clyde Snow travelled to Argentina after the fall of the 1976–83 military dictatorship and trained the students who became the Equipo Argentino de Antropología Forense (EAAF). The EAAF exhumed and identified victims, gave skeletal evidence in the 1985 trial of the juntas, and in 1997 identified the remains of Che Guevara in Bolivia. The ICMP's DNA-led programme has identified more than 20,000 persons missing from the conflicts in the former Yugoslavia, including around 7,000 victims of Srebrenica.",
 mechLabel:"Scientific mechanism",
 mech:"Forensic identification proceeds in two stages. Skeletal analysis first builds a biological profile: age at death from epiphyseal union and pubic symphysis changes, sex from pelvic and cranial morphology, stature from long-bone regression formulae, ancestry and individuating features from dental and skeletal traits, and trauma analysis to distinguish peri-mortem injury from post-mortem damage. DNA then confirms identity: short tandem repeat profiles from bone or teeth are matched against reference samples from relatives, with mitochondrial DNA used where nuclear DNA has degraded. The ICMP inverted older practice by making DNA matching the lead method and anthropological analysis the corroboration — a shift that made identification possible at the scale of thousands.",
 synth:[
  "Snow's idea of osteobiography — reading a life from bone — connects forensic practice to the wider biocultural tradition in physical anthropology, and the Argentine team's work shows applied anthropology in its strongest sense: science placed directly at the service of families and courts.",
  "Socio-cultural anthropology frames the same events from the side of the living. Without a body there can be no funerary ritual, no closure of mourning and no legal death, so the disappeared person is held in a suspended social category that prolongs the family's suffering."
 ],
 terms:[
  ["Enforced disappearance","Arrest or abduction by agents of the state, or with its acquiescence, followed by refusal to acknowledge the deprivation of liberty or the person's fate, placing the victim outside the protection of the law."],
  ["Forensic anthropology","The application of skeletal biology and archaeological recovery methods to legal questions, chiefly identification of human remains and reconstruction of the circumstances of death."],
  ["Biological profile","The composite estimate of age, sex, stature and ancestry built from skeletal indicators, narrowing the pool of possible identities before DNA confirmation."],
  ["Osteobiography","The reconstruction of an individual's life history, occupation, health and trauma from the skeleton; a term associated with Clyde Snow."],
  ["Humanitarian forensics","Forensic science conducted for the benefit of families and communities rather than only for prosecution — the mode in which the EAAF and ICMP largely work."]

 id:"accents", post:"p8", paper:"1",
 units:[["1","1.5"],["1","7.0"]],
 title:"Chimpanzee communities have accents, and the young grow into them",
 gist:"Vocalisations diverge between chimpanzee communities in the manner of regional accents, and some differences appear only in the juvenile years — which means part of the group signature is acquired, not inherited.",
 deploy:"Cite this as a 2026 study comparing Chimfunshi and Gombe chimpanzees in answers on primate communication. The theoretical payoff: traditional transmission, long held to separate human speech from primate calls, exists in rudimentary form in our closest relatives.",
 news:"A study published in PLoS ONE in September 2026, led by doctoral researcher Kassandra Giragosian of Queen Mary University of London, reports that chimpanzee vocalisations diverge between communities like regional accents, and that these population-specific patterns sharpen as young animals grow up. The team analysed grunts, whimpers and laughter from chimpanzees at the Chimfunshi Wildlife Orphanage in Zambia and wild chimpanzees of Gombe National Park in Tanzania. Some acoustic differences were present in infancy, but others emerged only in the juvenile years, indicating the calls are not rigidly fixed at birth. The authors note that an accent is not a language: chimpanzees show no agreed grammar or lexicon.",
 context:"For most of the twentieth century primate calls were treated as involuntary, genetically fixed signals, categorically different from learned human speech. That wall has been eroding for two decades — field studies documented community-specific tool traditions in the 1999 multi-site comparison led by Andrew Whiten, and pant-hoot variations between communities. This study adds a developmental dimension, tracking when in ontogeny the group signature appears and finding part of it acquired.",
 mechLabel:"Scientific mechanism",
 mech:"The method rests on comparative acoustics. Calls of the same functional type — a grunt, a whimper, a bout of laughter — were recorded from individuals of known age in both populations, their acoustic parameters measured, and between-population differences tested across age classes. If differences were wholly genetic they should be as sharp in infants as in adults. Instead several parameters diverged progressively with age: the signature of social learning acting on a partly flexible vocal system. This is vocal usage learning and vocal production plasticity rather than full vocal learning of the kind humans show, but it is plasticity nonetheless.",
 synth:[
  "Traditional transmission — the passing of a communication system through learning rather than genes — was long held to separate human speech from primate calls. If chimpanzee call structure is partly acquired from the social group, the gap becomes a matter of degree in this one respect, even as displacement, productivity and duality of patterning remain human monopolies.",
  "It strengthens the case for chimpanzee culture: community-specific behaviour maintained by social transmission. An accent is a cultural marker of group membership."
 ],
 terms:[
  ["Vocal plasticity","The capacity to modify the acoustic structure or use of calls in response to social and environmental input; intermediate between fixed signalling and true vocal learning."],
  ["Pant-hoot","A loud, complex chimpanzee vocalisation used to communicate and stay in contact over long distances."],
  ["Dialect (in animal communication)","Consistent, group-specific variation in the structure of shared call types, maintained across generations by learning rather than genetic divergence."],
  ["Ontogeny of communication","The developmental timetable along which an individual's signals mature."],
  ["Design features of language (Hockett)","The checklist — traditional transmission, displacement, productivity, duality of patterning — against which primate communication is measured."]
 ],
 scholars:["Kassandra Giragosian","Andrew Whiten","Jane Goodall","Charles Hockett"],
 communities:[],

{
 id:"ladakh", post:"p8", paper:"2",
 units:[["2","7.1"],["2","7.3"],["2","8.2"],["2","9.1"]],
 title:"Ladakhi groups' demands: Sixth Schedule, statehood and an elected legislature",
 gist:"The Leh Apex Body and Kargil Democratic Alliance, spanning Buddhist-majority Leh and Muslim-majority Kargil, postponed a march pending talks with the MHA over an elected legislature and constitutional safeguards modelled on Article 371 or the Sixth Schedule.",
 deploy:"Quote the LAB-KDA joint front as a live example in answers on constitutional safeguards, the Sixth Schedule debate, or ethnicity and regionalism among Himalayan Scheduled Tribes. Barth explains the striking Leh-Kargil unity: the boundary that now matters is between Ladakhis and the Centre.",
 news:"On 5 September 2026 the Leh Apex Body and the Kargil Democratic Alliance announced they had postponed a planned Kargil-to-Leh march, originally set for 10 September, to await the outcome of talks with the Union Ministry of Home Affairs on 9 September. Their demands include an elected legislature for the Union Territory and protections modelled on Article 371 or the Sixth Schedule. Ladakh has been a UT without a legislature since August 2019, and a May 2026 in-principle understanding had suggested constitutional safeguards alongside elected powers while treating full statehood as unfeasible on revenue grounds.",
 context:"When Article 370 was abrogated and Jammu and Kashmir reorganised in August 2019, Ladakh got UT status without an assembly, leaving its two Autonomous Hill Development Councils (Leh's dating to 1995, Kargil's to 2003) as the only elected bodies. More than nine-tenths of Ladakh's population is Scheduled Tribe — chiefly Bot/Boto, Balti, Purigpa, Changpa and Brokpa — and the National Commission for Scheduled Tribes recommended as early as September 2019 that Ladakh be brought under the Sixth Schedule.",
 mechLabel:"Legal mechanism",
 mech:"The Sixth Schedule, drafted by the Bordoloi sub-committee under Article 244(2), creates Autonomous District Councils with legislative power over land, forests, inheritance and customary law, and applies in Assam, Meghalaya, Tripura and Mizoram. Article 371 and its lettered successors give state-specific protections, such as 371A's guarantee that no parliamentary law touches Naga customary law or land without the state assembly's consent. Ladakh's demand is for machinery of either kind wired into a UT framework — stronger than the executive-order route, because constitutional entrenchment cannot be withdrawn by the government of the day.",
 synth:[
  "Barth's argument that ethnicity lives at the boundary, not in what it encloses, explains the Leh-Kargil unity: Buddhist and Shia communities with old rivalries have built a common Ladakhi ethnic front because the salient boundary is now between Ladakhis and the Centre.",
  "The episode extends the integration debate: Elwin's protectionism and Ghurye's assimilationism framed the 1940s, Nehru's Panchsheel sought a middle road, and Xaxa's later question — whether tribes can be citizens on their own terms — is what an elected legislature with Sixth Schedule-type safeguards would answer institutionally.",
  "The frontier location of the UT demands careful balancing of autonomy against India's strategic interests."
 ],
 terms:[
  ["Sixth Schedule","The scheme under Article 244(2) providing Autonomous District and Regional Councils with law-making and judicial powers over land, forest and custom in tribal areas of the Northeast."],
  ["Autonomous Hill Development Council","The statutory, not constitutional, councils governing Leh and Kargil, with executive but no legislative powers — the institutional gap at the heart of the demand."],
  ["Article 371-type safeguards","Region-specific constitutional protections, such as Nagaland's 371A, entrenching customary law and land rights against ordinary parliamentary legislation."],
  ["Ethnic boundary (Barth)","The social boundary ethnic groups maintain, which persists even as the cultural content on either side changes."],
  ["Constitutional entrenchment","Protection lodged in the constitutional text rather than executive notification, removable only by amendment."]
 ],

 units:[["2","7.3"],["2","8.2"],["2","6.2"]],
 title:"Manipur's ethnic conflict enters a new phase as Naga and Kuki-Zo groups clash",
 gist:"Violence along a new axis distinct from the Meitei-Kuki conflict since May 2023, with highway blockades, displacement and the hardening of an ethnic map into a triangular contest over territory and belonging.",
 deploy:"The 60,000 displaced since May 2023 and a new Naga versus Kuki-Zo front in 2026 are directly usable in Paper 2 answers on ethnic conflict, tribal movements or the tribe-nation-state relationship. Barth for boundaries, Weiner for sons-of-the-soil politics.",
 news:"Ethnic violence in Manipur escalated along a new axis: clashes between Naga and Kuki-Zo tribal communities, distinct from the Meitei-Kuki conflict that has convulsed the state since May 2023. Armed groups on both sides have burned homes, taken hostages and exchanged gunfire, and blockades of national highways have choked the movement of food, fuel and medicine.",
 context:"The crisis began on 3 May 2023, after a Manipur High Court direction that the state consider recommending ST status for the majority Meitei triggered tribal solidarity marches and then reciprocal violence between the valley-dwelling Meitei and the hill-dwelling Kuki-Zo. The state's geography is its sociology: the Imphal valley, about a tenth of the land, holds the Meitei majority, while the surrounding hills are home to Naga and Kuki-Zo Scheduled Tribes whose lands are protected by Article 371C arrangements and restrictions on land transfer. The Naga-Kuki axis has its own history of conflict in the early 1990s over land, territory and competing ethnic homelands.",
 mechLabel:"Political mechanism",
 mech:"Village defence volunteers and insurgent groups provide the organisational muscle. Highway blockades work because the hill roads are the valley's lifelines and vice versa, so control of movement becomes a weapon punishing whole populations. Displacement then hardens the ethnic map, as mixed settlements empty and each community consolidates in its own zone, making return harder and giving territorial claims a demographic reality they did not previously have.",
 synth:[
  "Barth again: ethnic boundaries are sharpest where groups compete for the same niche, and in Manipur the niches are land, ST status and political territory.",
  "The conflict illustrates what Myron Weiner called sons-of-the-soil politics, each community claiming primordial title to a homeland and reading every other claim as invasion."
 ],
 terms:[
  ["Ethnic conflict","Organised violence framed along ethnic boundaries, typically fought over territory, state resources or political recognition rather than cultural difference as such."],
  ["Sons-of-the-soil politics (Weiner)","Movements claiming prior and exclusive right to a region for its 'original' inhabitants, directed against internal migrants or neighbouring communities."],
  ["Internal displacement","Forced movement of people within national borders; Manipur's more than 60,000 displaced live largely in relief camps aligned with their own community's zone."],
  ["Hill-valley dichotomy","The layered ecological, ethnic and administrative division between Manipur's Meitei-dominated valley and its Naga and Kuki-Zo hills, governed under different land and representation regimes."]
 ],
 scholars:["Fredrik Barth","Myron Weiner"],
 communities:["Meitei","Kuki-Zo","Naga"],
 law:["Article 371C","Manipur High Court ST direction (2023)"],
 figures:["60,000+ displaced since May 2023","Conflict began 3 May 2023","Valley is ~10% of state's land"]

{
 id:"womenfarmers", post:"p8", paper:"2",
 units:[["2","5.1"],["2","5.3"],["2","7.1"],["1","2.5"]],
 title:"Recognised but not owning: women farmers and the land question",
 gist:"Maharashtra's Women Farmers Empowerment Act creates a certificate granting credit, insurance and subsidy access independent of land ownership — recognition that deliberately routes around title rather than touching it.",
 deploy:"The central line is worth carrying whole: recognition changes who the state sees; ownership changes who decides. Pair the Maharashtra Act with Agarwal's bargaining framework and the 60 per cent labour versus 15 per cent title gap.",
 news:"An analysis in Down To Earth on 1 September 2026 examined India's new wave of women-farmer recognition and its worth without land titles. Women do about 60 per cent of India's agricultural work but hold fewer than 15 per cent of land titles, in a sector employing 46 per cent of the national workforce while contributing 17 to 18 per cent of GDP. Maharashtra's Women Farmers Empowerment Act of 2 July 2026 creates a women farmer certificate granting access to credit, crop insurance and subsidies independent of land ownership, reserves 30 per cent of state agricultural programme benefits for women, and posts dedicated women farmers' assistance officers at block and district levels. In Maharashtra 82 per cent of the rural female workforce works in agriculture against 58 per cent of rural men, yet women own only 15.5 per cent of operational farmland. The analysis set this against Uttarakhand's 2021 reform granting wives co-ownership rights in husbands' agricultural land, affecting about 3.5 million women.",
 context:"The gap between women's agricultural labour and their property rights is an old feature of the Indian agrarian order. Male out-migration has steadily feminised farm work, a trend visible since the 1990s, while inheritance practice lagged even after the Hindu Succession (Amendment) Act, 2005 made daughters coparceners in ancestral property. Social pressure to relinquish shares in favour of brothers, and revenue records that default to male names, kept titles from following the law.",
 mechLabel:"Legal mechanism",
 mech:"The Maharashtra Act works by decoupling the status of 'farmer' from the fact of ownership: the certificate makes a woman eligible for the credit, insurance and subsidy machinery that previously recognised only the male title-holder. What it does not touch is devolution of the land itself, which remains governed by personal law and revenue-record practice. Unless mutation entries, succession records and new allotments are made dual-name by default, recognition remains revocable goodwill rather than bargaining power.",
 synth:[
  "Bina Agarwal's A Field of One's Own (1994) — that land is the single most important determinant of rural women's economic status and intra-household bargaining power — anticipates exactly the recognition-versus-ownership distinction this article hinges on.",
  "Development interventions that ignore women's actual farm labour end up entrenching male control.",
  "This connects Paper 1 kinship and descent to Indian agrarian reality: where productive property passes through males, women's economic citizenship depends on deliberate legal correction."
 ],
 terms:[
  ["Feminisation of agriculture","The rising share of women in agricultural labour as men migrate to non-farm work, without a matching rise in women's control over land and farm decisions."],
  ["Operational holding","The land a cultivator actually operates, as against what is owned; women's 15.5 per cent share of operational farmland in Maharashtra measures management, with ownership lower still."],
  ["Coparcenary rights","Birthright shares in Hindu ancestral property, extended to daughters by the 2005 amendment to the Hindu Succession Act, 1956."],
  ["Intra-household bargaining (Agarwal)","The framework treating the household as a site of cooperation and conflict in which a member's fallback position, strengthened decisively by land ownership, shapes outcomes."],
  ["Dual-name title","A land record carrying both spouses' names by default; the administrative device for converting recognition into ownership."]
 ],
 scholars:["Bina Agarwal"],
 communities:[],
 law:["Maharashtra Women Farmers Empowerment Act, 2026","Hindu Succession (Amendment) Act, 2005","Uttarakhand co-ownership reform (2021)"],
 figures:["Women: ~60% of farm work, <15% of titles","Agriculture: 46% of workforce, 17–18% of GDP","Maharashtra: 82% rural women vs 58% rural men in agriculture; 15.5% of operational farmland","Uttarakhand 2021: ~3.5 million women"]
}

{ex:"Luncz et al. (Proc. R. Soc. B, 2026): wild bearded capuchins prefer a worn nut-cracking stone over a mechanically better fresh one, learning from the traces rather than from watching another individual",type:"study",units:[["1","1.5"],["1","1.8"]],from:"capuchin"},
{ex:"Accumulated used tools work as an external memory, each modified stone carrying information from a user the learner never met — with the direct inference that stone accumulations at hominin sites may have guided tool traditions the same way",type:"theory",units:[["1","1.8"],["1","7.0"]],from:"capuchin"},

{ex:"Mukkera Venkata Ratnam (2026 INSC 810): where every party is non-tribal, civil courts keep jurisdiction inside a Scheduled Area, because the protective machinery's object is tribal people rather than tribal territory",type:"law",units:[["2","7.1"],["2","9.1"]],from:"mukkera"},
{ex:"Agency courts, customary law and ordinary civil courts running in parallel in the Andhra and Telangana Agency tracts — legal pluralism as a working feature of Indian tribal administration",type:"theory",units:[["2","9.1"],["2","7.1"]],from:"mukkera"},

{ex:"Article 243ZC bars municipalities from Scheduled Areas unless Parliament extends them, and no such law exists — so a town growing inside a Scheduled Area is too urban for the gram sabha and constitutionally barred from a municipal council; the Supreme Court declined Roat's petition in August 2026 as legislative policy",type:"law",units:[["2","9.1"],["2","5.1"]],from:"urbangap"},

{ex:"Union affidavit (2026): the creamy layer cannot apply to SCs and STs, because reservation rests on historical and social criteria, not solely on economic status, and only Parliament may modify the lists under Articles 341 and 342",type:"law",units:[["2","7.1"]],from:"creamy"},
{ex:"Indra Sawhney (1992) created the creamy layer for OBCs only; Davinder Singh (2024) permitted sub-classification within SCs and STs and four judges suggested in obiter that creamy layer should reach them too",type:"law",units:[["2","7.1"],["2","3.2"]],from:"creamy"},

{ex:"PM-JANMAN (2023) is the first mission-mode programme exclusively for the 75 PVTGs, with DAJGUA (2024) scaling the convergence model to tribal-majority villages generally",type:"pol",units:[["2","9.1"],["2","6.3"]],from:"janman"},
{ex:"3,406 Van Dhan Vikas Kendras generating about ₹174 crore from value-added forest produce; 479 Eklavya Model Residential Schools with 1,38,336 students (Rajya Sabha, August 2026)",type:"fig",units:[["2","9.1"]],from:"janman"},
{ex:"Article 275(1) is the Constitution's dedicated funding pipe for tribal welfare — grants-in-aid from the Consolidated Fund, financing EMRS since 1997–98",type:"law",units:[["2","7.1"],["2","9.1"]],from:"janman"},

{ex:"Kalahandi field study (2026): 66 per cent of tribal deliveries still at home, 71 per cent preferring it, 68 per cent finding hospitals too expensive, 60 per cent reporting mothers-in-law discouraging hospital birth, 30 per cent citing shyness",type:"fig",units:[["2","6.2"],["2","9.1"]],from:"midwives"},
{ex:"Among the Baiga of Kabirdham the daai remains the trusted childbirth specialist decades after Janani Suraksha Yojana began paying for institutional delivery — persistence of home birth as a demand-side phenomenon, not only a supply failure",type:"eth",units:[["2","6.2"],["1","12.0"]],from:"midwives"},
{ex:"Brigitte Jordan's authoritative knowledge (Birth in Four Cultures, 1978): every society decides whose knowledge counts in the birthing room, so a system that dismisses the daai dismisses the social world that trusts her",type:"theory",units:[["1","12.0"],["2","6.2"]],from:"midwives"},

{ex:"Sakhua Mahotsav, Ranchi 2026: a drive to plant one lakh sal saplings built on Sarhul, the sarna grove and the proverb sakhua phule, dharti jhule — tribal religion operating as urban environmental policy",type:"pol",units:[["2","3.3"],["2","8.1"]],from:"sakhua"},
{ex:"The sarna of the Oraon and jaherthan of the Santal: stands of uncut sal where the village's founding spirits reside, with Sarhul timed to the sal's flowering and the pahan offering blossoms to earth and village deities",type:"eth",units:[["2","3.3"],["1","5.0"]],from:"sakhua"},
{ex:"Gadgil and Vartak on sacred groves as conservation institutions — ritual prohibition on felling protecting biodiversity islands, shrine and seed bank and water source at once",type:"theory",units:[["2","3.3"],["1","9.8"]],from:"sakhua"},

{ex:"Gran Dolina parietals (CENIEH, 2026): Homo antecessor's diploë makes up 41 to 50 per cent of vault thickness, matching Homo sapiens and the Neanderthals rather than the archaic Homo erectus condition",type:"study",units:[["1","1.6"]],from:"antecessor"},
{ex:"Homo antecessor as the textbook case of mosaic evolution — a modern mid-face with a canine fossa, now a modern-type cranial vault, and primitive traits elsewhere, exactly what the Synthetic Theory predicts when traits respond to selection at different rates",type:"theory",units:[["1","1.6"],["1","1.4"]],from:"antecessor"},

{ex:"Valdegoba Cave (2026): 38 bone retouchers among 12,000 fragments, with large-herbivore long bones preferentially selected, used repeatedly and kept in service even after breaking; plus the first Neanderthal bone tools recorded in Romania",type:"study",units:[["1","1.6"],["1","1.8"]],from:"bonetools"},
{ex:"Binford's distinction between expedient and curated technology: tools made, kept, re-used and repaired imply the planning depth he reserved for fully modern foragers — which sits badly with any model of Neanderthals as cognitively second-rate",type:"theory",units:[["1","1.8"],["1","1.6"]],from:"bonetools"},

{ex:"Flohr et al.: charred barley and wheat from Pre-Pottery Neolithic Jordan show that grains in the 'domestic' size range carry carbon isotope values indicating wetter growing conditions — so early grain size cannot date the onset of human selection",type:"study",units:[["1","1.8"]],from:"grain"},
{ex:"Protracted domestication against Childe's Neolithic Revolution: domestication traits accumulated over millennia, and niche construction (Smith, Zeder) means early farmers reshaped the plant's world long before they reshaped its genome",type:"theory",units:[["1","1.8"],["1","3.0"]],from:"grain"},

{ex:"Census 2027 notification (14 August 2026): caste enumeration returns after 95 years, with Question 10 reading 'SC/ST/Caste' and the caste question left open-ended, no dropdown and no master list",type:"pol",units:[["2","2.0"],["2","3.2"]],from:"census"},
{ex:"Risley's 1901 census attempted to rank castes by social precedence and provoked a flood of petitions from castes claiming higher status; Hutton's 1931 census was the last full count and remains the statistical bedrock of caste policy",type:"law",units:[["2","3.2"],["2","4.0"]],from:"census"},
{ex:"Cohn and Dirks (Castes of Mind, 2001): the colonial census did not merely record caste but objectified it, fixing fluid identities into enumerable rankable units — against which stands the argument that what the state cannot count it cannot compensate",type:"theory",units:[["2","3.2"],["2","4.0"]],from:"census"},
{ex:"SECC 2011 collected caste data so unusable it was never fully released, generating lakhs of unclassifiable entries — the cautionary precedent for an open-ended 2027 question",type:"fig",units:[["2","2.0"],["2","3.2"]],from:"census"},
{ex:"Census 2027 by the numbers: 30 lakh enumerators, ₹11,718.24 crore, India's first fully digital census, reference date 1 March 2027",type:"fig",units:[["2","2.0"]],from:"census"},

{ex:"Ministry of Tribal Affairs budget up more than threefold, from ₹4,826 crore (2016–17) to ₹15,421.97 crore (2026–27), with PM-JANMAN's PVTG package at ₹24,104 crore",type:"fig",units:[["2","9.1"],["2","6.3"]],from:"eightyyears"},
{ex:"Ol Chiki, invented by Pandit Raghunath Murmu in 1925; Santali entered the Eighth Schedule in 2003, the only tribal language there with its own indigenous script",type:"eth",units:[["2","2.0"],["2","5.2"]],from:"eightyyears"},
{ex:"The Bastar Tiranga Yatra of August 2026 carried the tricolour through Tadmetla, Burkapal and Tekalgudem — the counterinsurgency state converting territorial control into symbolic belonging",type:"pol",units:[["2","8.2"],["2","7.3"]],from:"eightyyears"},
{ex:"Nehru's tribal Panchsheel, from his 1957 foreword to Elwin's A Philosophy for NEFA: development along the people's own genius, respect for rights in land and forest, training of tribal personnel, a light administrative touch, and results judged by human character rather than statistics",type:"theory",units:[["2","9.1"],["2","7.3"]],from:"eightyyears"},
{ex:"Gellner and Anderson on nations built from curated memory: Birsa Munda entering the pantheon as freedom fighter, Ol Chiki as heritage, Bastar's festival as development model — the state incorporating its margins through invoked tradition",type:"theory",units:[["2","8.2"]],from:"eightyyears"},

{ex:"Ken-Betwa's Daudhan Dam displaces roughly 7,000 families across Panna and Chhatarpur, and an estimated 400–500 women, particularly widows, were left off the compensation roll despite LARR 2013 treating adult women as separate family units",type:"law",units:[["2","6.3"],["2","7.1"]],from:"kenbetwa"},
{ex:"Gond women at Ken-Betwa: Gyan Rani Gond owning 1.2 hectares and receiving nothing, her 18-year-old daughter deemed too young despite holding voter ID, a 21-year-old widow receiving nothing — exclusion working through enumeration by ration card and revenue record",type:"eth",units:[["2","6.3"],["2","7.1"]],from:"kenbetwa"},
{ex:"The Chita Andolan of July 2026 — about thirty women staging a funeral-pyre protest, with an 18-day hunger strike forcing district verification orders",type:"eth",units:[["2","6.3"],["2","7.2"]],from:"kenbetwa"},
{ex:"Walter Fernandes: roughly 60 million people displaced by projects between 1947 and 2000, tribals about 40 per cent of them while barely 8 per cent of the population",type:"fig",units:[["2","6.3"]],from:"kenbetwa"},
{ex:"Cernea's Impoverishment Risks and Reconstruction model — landlessness, joblessness, homelessness, marginalisation, food insecurity, morbidity, loss of common property, social disarticulation — and the point that these risks fall unevenly within a household",type:"theory",units:[["2","6.3"]],from:"kenbetwa"},

{ex:"Youth dormitories as transmission institutions: the Ghotul of the Muria Gonds (Elwin, 1947) with its Sirdar and Belosa, the Dhumkuria of the Oraons (S.C. Roy), the Morung of the Naga tribes — adolescence converted into apprenticeship",type:"eth",units:[["2","6.1"],["2","3.3"]],from:"keylong"},
{ex:"Nati at the Lahaul-Spiti Tribal Festival, with lama-led puja, working as a Barthian boundary marker — identity sustained through symbolic display in interaction with dominant neighbours, not through isolation",type:"eth",units:[["2","7.3"],["2","6.1"]],from:"keylong"},
{ex:"Totemism as the institution that converts kinship into environmental ethics while regulating marriage through clan exogamy",type:"theory",units:[["1","2.5"],["2","3.3"]],from:"keylong"},

{ex:"Bastar Dussehra: 75 days from the Pat Jatra forging of chariot tools, centred on Danteshwari, conducted by hereditary Manjhi, Chalki, Pujari and Sevadars drawn from villages across the erstwhile princely state",type:"eth",units:[["2","3.3"],["2","8.1"]],from:"bastar"},
{ex:"Bastar Dussehra maps onto Vidyarthi's Sacred Complex triad exactly: Danteshwari's shrines as the sacred geography, the 75-day calendar as the sacred performances, the Manjhi-Chalki-Pujari hierarchy as the sacred specialists",type:"theory",units:[["2","3.3"]],from:"bastar"},
{ex:"Marriott's universalization and parochialization running simultaneously at Bastar — a pan-Indian festival name over a local goddess cult, tribal deities absorbed upward as the great tradition is absorbed downward",type:"theory",units:[["2","3.2"],["2","3.3"]],from:"bastar"},

{ex:"23 August is fixed to the Haitian uprising of 1791 rather than to any European act of abolition, so abolition is remembered as something won by resistance rather than granted by decree",type:"pol",units:[["1","9.5"],["1","1.1"]],from:"slavetrade"},
{ex:"Boas's 1912 study of head form among immigrants showed supposedly fixed racial traits shifting within a single generation of changed environment",type:"study",units:[["1","9.5"],["1","6.0"]],from:"slavetrade"},
{ex:"The UNESCO Statements on Race (1950, drafted under Ashley Montagu, revised 1951) declared race biologically meaningless as a rank ordering of humanity — anthropologists dismantling the science that had underwritten slavery and colonialism",type:"law",units:[["1","9.5"],["1","1.1"]],from:"slavetrade"},
{ex:"Herskovits (The Myth of the Negro Past, 1941) documented African survivals in language, religion and family across the Americas; Mintz and Price later reframed survivals as creolization, new cultures forged under extreme constraint",type:"theory",units:[["1","9.5"],["1","2.1"]],from:"slavetrade"},
{ex:"Lewontin's 1972 apportionment: the great majority of human genetic variation sits within populations rather than between them, which is why variation is clinal and discrete races do not hold",type:"fig",units:[["1","9.5"],["1","9.0"]],from:"slavetrade"},

{ex:"Towle (American Journal of Biological Anthropology, 2026) proposes folding Australopithecus and Paranthropus into Homo, since small-brained Homo floresiensis and Homo naledi sit inside the genus while the australopithecines are credited with increasingly complex behaviour",type:"study",units:[["1","1.6"],["1","1.4"]],from:"towle"},
{ex:"Clades versus grades: traditional hominin taxonomy groups by adaptive level, and every fossil that mixes traits across grade boundaries weakens it — Wood and Collard's 1999 criteria (body proportions, obligate bipedalism, modern-humanlike development) are the standard counterposition",type:"theory",units:[["1","1.6"],["1","6.0"]],from:"towle"},
{ex:"Mayr proposed a single hominin genus in 1950; Leakey, Tobias and Napier stretched Homo in 1964 to admit Homo habilis below the accepted brain-size threshold — so the criteria for the genus have always been negotiable",type:"theory",units:[["1","1.6"]],from:"towle"},
{ex:"The Cerebral Rubicon, a cranial capacity threshold of 600 to 750 cc once required for membership of Homo, now largely abandoned",type:"fig",units:[["1","1.6"]],from:"towle"},

{ex:"Rak and Been (Scientific Reports, 2026): male Neanderthal pelves from Kebara and Sima de los Huesos resemble modern human females, and only modern human males show the forward acetabulum with short thick pubic bones that works as a shock absorber and energy-return system",type:"study",units:[["1","1.5"],["1","1.6"]],from:"pelvis"},
{ex:"Washburn's obstetrical dilemma given a new twist: males, freed from the obstetric constraint, evolved onward, while females retained the ancestral pelvic geometry because narrowing would compromise childbirth",type:"theory",units:[["1","1.5"],["1","10.0"]],from:"pelvis"},

{ex:"Sikkim's peer-led rehabilitation: Jeevan Marg at Ranipool (46 residents, three to six months) and Freedom Recovery at Tathangchen (55 residents, 120 days), run by ex-users, with users concentrated in the 13–25 age group",type:"eth",units:[["2","6.2"],["2","9.2"]],from:"sikkim"},
{ex:"Kleinman's disease and illness distinction with Janzen's therapy management group: the community reabsorbs the addict as kin rather than expelling him as deviant, addressing the stigma and relapse cycle that clinical detoxification cannot touch",type:"theory",units:[["1","12.0"],["2","6.2"]],from:"sikkim"},
{ex:"The Sikkim Anti Drugs Act, 2006 treated users as candidates for care rather than only prosecution, well before the national Nasha Mukt Bharat Abhiyaan of 2020",type:"law",units:[["2","6.2"],["2","9.1"]],from:"sikkim"},

{ex:"MoTA National Conclave on Tribal Languages and Museums, Mysuru, August 2026: documentation of unwritten dialects, Mother Tongue-Based Multilingual Education under NEP 2020, AI speech-recognition corpora, and community-curated museums",type:"pol",units:[["2","2.0"],["2","9.1"]],from:"languages"},
{ex:"Tribal India's languages span four families — Austroasiatic (Munda), Dravidian (Gondi, Kurukh, Kui), Tibeto-Burman (Bodo, Mizo, Naga) and Indo-Aryan (Bhili) — with dozens of mother tongues severely endangered on the People's Linguistic Survey",type:"fig",units:[["2","2.0"],["2","5.2"]],from:"languages"},
{ex:"Linguistic relativity applied to policy: the extinction of a tribal dialect is the irreversible loss of cognitive taxonomies and medicinal plant names, not merely of words",type:"theory",units:[["1","7.0"],["2","5.2"]],from:"languages"},

{ex:"Accumulative stone throwing in Boé National Park (Nakano and Kalan, 2026): adult male chimpanzees hurling rocks at particular trees for over a decade, with pant-hoots and buttress drumming, in only four West African populations though suitable rocks exist range-wide",type:"study",units:[["1","1.5"],["1","7.0"]],from:"stonethrow"},
{ex:"Where ecology cannot explain a behavioural difference between groups, social learning can — the operational test of culture in primatology, and the basis of Whiten et al.'s 1999 catalogue of 39 chimpanzee behavioural variants",type:"theory",units:[["1","1.5"],["1","2.1"]],from:"stonethrow"},
{ex:"Durkheim tied ritual to collective representations, so chimpanzee stone piles that mark places without referential meaning sit at the boundary between behavioural tradition and symbol — sharpening rather than dissolving the question of human symbolism",type:"theory",units:[["1","5.0"],["1","7.0"]],from:"stonethrow"},

{ex:"Hunter-gatherer sleep (Brain Medicine, 2026): the Hadza, San and Tsimane average 5.7 to 7.1 hours a night with insomnia prevalence under 2 per cent, sleep onset tracking nocturnal temperature decline rather than darkness",type:"study",units:[["1","9.8"],["1","11.0"]],from:"sleep"},
{ex:"Evolutionary mismatch theory: modern sleep disorders arise from the gap between ancestral physiology tuned to temperature cues and communal security, and an environment of climate control, isolated bedrooms and screens",type:"theory",units:[["1","1.4"],["1","9.8"]],from:"sleep"},

{ex:"Yindjibarndi appeal (Federal Court of Australia, 2026): AUD 150 million awarded and over AUD 1.3 billion sought, on the argument that compensation for native title extinguishment must account primarily for irreversible spiritual and cultural injury to songlines, waterholes and burial grounds",type:"law",units:[["1","4.0"],["2","6.3"]],from:"yindjibarndi"},
{ex:"Timber Creek (2019) established spiritual loss as a distinct head of damages in Australian native title, and UNDRIP Article 28 guarantees redress for lands damaged without free, prior and informed consent",type:"law",units:[["1","4.0"],["2","7.1"]],from:"yindjibarndi"},
{ex:"Relational ontology: indigenous land tenure treats human identity, spiritual life and physical geography as co-constitutive, which is why western property law's divisible commodity cannot price it",type:"theory",units:[["1","4.0"],["2","3.3"]],from:"yindjibarndi"},

{ex:"Joan Mencher's 'The Caste System Upside Down' (Current Anthropology, 1974): seen from the bottom, caste looks like a system of economic exploitation that keeps the exploited divided — the materialist answer to Dumont's Homo Hierarchicus",type:"theory",units:[["2","3.2"],["1","6.0"]],from:"mencher"},
{ex:"Mencher's trajectory from the Nayar taravad and Namboodiri marriage rules to agricultural labourers in Palakkad and Chingleput mirrors the discipline's own 1970s turn towards Marxist anthropology and, later, action anthropology",type:"theory",units:[["2","4.0"],["2","5.1"]],from:"mencher"},
{ex:"Mencher died on 7 August 2026 aged 96; her data on who actually transplants, weeds and harvests fed the case for recognising women as farmers",type:"eth",units:[["2","4.0"],["2","5.1"]],from:"mencher"},

{ex:"Suratha Kisan's Singha Bahini Seed Bank, Sundargarh: 110+ indigenous rice varieties plus 18 millets, 6 pulses, 10 vegetables and 2 oilseeds, from 35 landraces in 2014–15, with about 80 participating farmers",type:"eth",units:[["2","9.2"],["2","6.2"]],from:"seedbank"},
{ex:"Landrace cultivation costs ₹3,000–4,000 an acre against ₹6,000–8,000 for high-yielding varieties with their fertiliser and pesticide load, and the desi varieties tolerate the drought and pests that damage HYVs",type:"fig",units:[["1","3.0"],["2","9.2"]],from:"seedbank"},
{ex:"The Jeypore tract of Koraput as a centre of origin of cultivated rice, recognised by FAO as a Globally Important Agricultural Heritage System in 2012, with Kamala Pujari's Padma Shri in 2019 making the conserving Adivasi woman farmer a national figure",type:"pol",units:[["2","9.2"],["2","6.1"]],from:"seedbank"},
{ex:"Mauss on the gift: seed lent and returned with increment makes the surplus social as much as agronomic, enrolling 80 households into a moral economy of shared insurance",type:"theory",units:[["1","3.0"]],from:"seedbank"},

{ex:"Nilgiri complex: pastoral Toda supplying ghee and buffalo dairy, Kota artisan-musicians making iron tools and playing at Toda and Badaga funerals, Kurumba forest-dwellers feared as sorcerers, Irula supplying game and labour — Rivers, The Todas (1906)",type:"eth",units:[["2","6.1"],["1","3.0"]],from:"nilgiri"},
{ex:"Mandelbaum on the Nilgiris: exchange was ritually embedded rather than merely transactional, which made inter-tribal bonds culturally inalienable — a Kota could not simply decline to play at a Toda funeral",type:"theory",units:[["2","6.1"],["1","3.0"]],from:"nilgiri"},
{ex:"The Nilgiri symbiosis dissolved on several fronts at once: plantations took Toda grazing land, mass-produced goods broke the Kota artisan monopoly, Christianisation weakened belief in Kurumba sorcery, and forest law marginalised the Irula — mutual interdependence becoming competitive co-existence",type:"eth",units:[["2","7.2"],["2","6.2"]],from:"nilgiri"},

{ex:"Central Indian complex: dominant Gond agriculturalists, Agaria iron-smelters occupying the Kota's functional niche, Baiga priest-cultivators, Pardhan bards keeping Gond genealogy in song — Elwin's corpus throughout",type:"eth",units:[["2","6.1"],["1","3.0"]],from:"centralindia"},
{ex:"The Baiga practised bewar and refused the plough as a matter of cosmological principle, being recognised by the Gond and Kol as the region's most ancient inhabitants and employed for curative and divinatory service",type:"eth",units:[["2","6.1"],["2","3.3"]],from:"centralindia"},
{ex:"Elwin's Agaria (1942): not merely blacksmiths but custodians of a sacred metallurgical tradition, extracting ore from the Maikala range for the ploughshares and axes the Gond depended on",type:"eth",units:[["2","6.1"],["1","3.0"]],from:"centralindia"},

{ex:"Chota Nagpur complex: Munda and Ho on khuntkatti tenure, Santal clearing forest on the lowland margins, Birhor supplying rope, monkey meat and forest medicine for grain in a hereditary asymmetric bond resembling jajman-kamin — S.C. Roy, The Birhors (1925)",type:"eth",units:[["2","6.1"],["1","3.0"]],from:"chotanagpur"},
{ex:"The Lohar, technically a caste group, functioning inside the tribal exchange network as blacksmiths — Bose's 'Hindu method of tribal absorption' visible in an occupational niche",type:"theory",units:[["2","3.2"],["2","6.1"]],from:"chotanagpur"},
{ex:"Colonial forest extraction, zamindari and diku migration marginalised the Birhor and broke the Mahali's artisan role — both now PVTGs — and the destruction of these arrangements precipitated the Santal Hul (1855–56) and the Munda Ulgulan (1899–1900)",type:"eth",units:[["2","8.2"],["2","6.2"]],from:"chotanagpur"},

{ex:"Apa Tani wet rice with fish-cum-paddy cultivation and elaborate irrigation produced a surplus from a valley of about 15,000 people that the swidden-cultivating Nishi and Hill Miri could not match — ecological asymmetry as the basis of formal inter-tribal trade",type:"eth",units:[["2","6.1"],["1","3.0"]],from:"apatani"},
{ex:"The poge system documented by von Fürer-Haimendorf: formalised debt-bondage in which Nishi individuals in distress entered temporary service in Apa Tani households with defined rights and obligations on both sides",type:"eth",units:[["2","6.1"],["1","4.0"]],from:"apatani"},
{ex:"Mithun exchange ceremonies formalising peace pacts between Apa Tani, Nishi and Hill Miri, alongside a prestige economy of brass plates, beads and cattle structuring internal hierarchy — complex surplus institutions arising without a caste framework",type:"eth",units:[["1","4.0"],["2","6.1"]],from:"apatani"},

{ex:"Wayanad complex: Kurichiya cultivators with hereditary headmen and a martial tradition, Paniya agricultural labourers bound under the adima system, Kurumba supplying honey, medicine and sorcery — hierarchy and bondage alongside economic complementarity",type:"eth",units:[["2","6.1"],["2","7.1"]],from:"wayanad"},
{ex:"The Kerala Agricultural Workers Act (1974) and Bonded Labour System (Abolition) Act (1976) freed the Paniya from adima and removed the patron-client security together — a legal emancipation that produced economic vulnerability",type:"law",units:[["2","7.1"],["2","7.2"]],from:"wayanad"},

{ex:"Clyde Snow trained the students who became the Equipo Argentino de Antropología Forense in 1984; the EAAF gave skeletal evidence at the 1985 trial of the juntas and identified Che Guevara's remains in 1997",type:"eth",units:[["1","12.0"],["1","1.3"]],from:"forensic"},
{ex:"The ICMP has identified more than 20,000 persons missing from the conflicts in the former Yugoslavia, including around 7,000 victims of Srebrenica, by inverting older practice to make DNA matching the lead method and anthropological analysis the corroboration",type:"fig",units:[["1","12.0"],["1","9.0"]],from:"forensic"},
{ex:"Snow's osteobiography — reading a life history, occupation, health and trauma from the skeleton — and his line that the skeleton is a witness that does not forget",type:"theory",units:[["1","12.0"],["1","1.3"]],from:"forensic"},
{ex:"Without a body there is no funerary ritual, no closure of mourning and no legal death, so the disappeared person is held in a suspended social category that prolongs the family's suffering",type:"theory",units:[["1","5.0"],["1","12.0"]],from:"forensic"},

{ex:"Giragosian (PLoS ONE, 2026): chimpanzee vocalisations diverge between the Chimfunshi and Gombe populations like regional accents, with some differences appearing only in the juvenile years, so part of the group signature is acquired rather than inherited",type:"study",units:[["1","1.5"],["1","7.0"]],from:"accents"},
{ex:"Traditional transmission, long held to separate human speech from primate calls, exists in rudimentary form in chimpanzees — while displacement, productivity and duality of patterning remain human monopolies on Hockett's checklist",type:"theory",units:[["1","7.0"],["1","1.5"]],from:"accents"},

{ex:"The Leh Apex Body and Kargil Democratic Alliance holding a joint front across Buddhist-majority Leh and Shia-majority Kargil, postponing their march in September 2026 pending talks with the MHA on an elected legislature and Sixth Schedule-type safeguards",type:"pol",units:[["2","7.3"],["2","8.2"]],from:"ladakh"},
{ex:"Barth on ethnicity living at the boundary: communities with old rivalries built a common Ladakhi front because the boundary that now matters is between Ladakhis and the Centre",type:"theory",units:[["2","7.3"]],from:"ladakh"},
{ex:"More than nine-tenths of Ladakh's population is Scheduled Tribe — Bot, Balti, Purigpa, Changpa, Brokpa — and the NCST recommended Sixth Schedule status as early as September 2019, while Leh's and Kargil's Hill Councils remain statutory rather than constitutional bodies",type:"law",units:[["2","7.1"],["2","9.1"]],from:"ladakh"},

/* ---------------- persistence ---------------- */
async function loadState(){
  try {
    const r = await window.storage.get("anthro-index-progress");
    if (r && r.value) {
      const d = typeof r.value === "string" ? JSON.parse(r.value) : r.value;
      marks = d.marks || {}; termMarks = d.termMarks || {};
      theme = d.theme || "auto"; rsize = d.rsize || "m";
    }
  } catch(e) { /* no saved state yet */ }
}
let saveTimer = null;
function saveState(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try { await window.storage.set("anthro-index-progress", JSON.stringify({marks, termMarks, theme, rsize})); }
    catch(e) { console.error("Could not save progress", e); }
  }, 400);
}

  root.dataset.theme = t;
  root.dataset.size = rsize;
  document.body.classList.toggle("focus", focusMode);
}

/* ---------------- card rendering ---------------- */
function chips(it){
  return `<div class="chips">` +
    it.units.map(([p,u]) => `<button class="chip" data-unit="${p}|${u}" style="--pc:${PC[p]}" title="${esc(unitName(p,u))}">P${p} · ${u}</button>`).join("") +
    `<span class="chip plain">${POSTS[it.post].range}</span></div>`;
}
function hl(text){
  if (!query || query.length < 2) return esc(text);
  const re = new RegExp("(" + query.replace(/[.*+?^${}()|[\]\\]/g,"\\$&") + ")","ig");
  return esc(text).replace(re,"<mark>$1</mark>");
}
/* Long fields arrive as single unbroken blocks. Split anything over ~80 words
   at the sentence boundary nearest the middle, masking abbreviations and
   initials first so "L.P. Vidyarthi" and "Dr." are not mistaken for full stops. */
const ABBR = /\b(Dr|Mr|Mrs|Ms|Prof|St|Rev|Jr|Sr|vs|No|Vol|Fig|al|cf|ca|approx|Inc|Ltd|Co|Govt|pp|ed|eds|viz)\./g;
const maskAbbr = t => String(t).replace(ABBR, m => m.replace(/\./g,"\u0001"))
                               .replace(/\b([A-Z])\./g, "$1\u0001");
const unmask = t => t.replace(/\u0001/g, ".");
function para(text){
  const out = [];
  String(text).split(/\n\n+/).forEach(b => {
    if (b.split(/\s+/).length < 80) { out.push(b); return; }
    const sents = maskAbbr(b).split(/(?<=[.!?])\s+(?=[A-Z\u201C"])/);
    if (sents.length < 3) { out.push(b); return; }
    const lens = sents.map(x => x.split(/\s+/).length);
    const total = lens.reduce((a,c) => a+c, 0);
    let run = 0, idx = 0, best = Infinity;
    for (let i = 0; i < sents.length-1; i++) {
      run += lens[i];
      const d = Math.abs(run - total/2);
      if (d < best) { best = d; idx = i; }
    }
    out.push(unmask(sents.slice(0,idx+1).join(" ")));
    out.push(unmask(sents.slice(idx+1).join(" ")));
  });
  return out.filter(Boolean).map(t => `<p>${hl(t)}</p>`).join("");
}

function cardsHTML(list){
