}

/* ---------------- views ---------------- */
function viewMap(){
  let html = `<h2 class="vhead">Syllabus map</h2>
  <p class="vsub">Every card filed against the units it can serve. Tally marks show how many examples you have for each unit; empty rows are the ground current affairs cannot cover for you.</p>
  <div class="papers">`;
  for (const p of ["1","2"]) {
    const label = SYLLABUS[p].label;
    let pCount = 0;
    SYLLABUS[p].groups.forEach(g => g.units.forEach(([c]) => pCount += itemsForUnit(p,c).length));
    html += `<section><div class="paperhead" style="--pc:${PC[p]}"><h3>${esc(label)}</h3><span>${pCount} entries</span></div>`;
    for (const g of SYLLABUS[p].groups) {
      html += `<div class="grp"><h4>${esc(g.name)}</h4>`;
      for (const [code,name] of g.units) {
        const n = itemsForUnit(p,code).length;
        html += `<button class="unit ${n?"":"empty"}" data-unit="${p}|${code}" style="--pc:${PC[p]}">
          <span class="code">${code}</span>
          <span class="nm">${esc(name)}</span>
          ${n ? `<span class="tally">${'<i></i>'.repeat(n)}</span>` : `<span class="gap">no card</span>`}
        </button>`;
      }
      html += `</div>`;
    }
    html += `</section>`;
  }
  return html + `</div>`;

// Dashes, curly quotes and diacritics vary across the corpus; fold them all
// so "nature-man", "Nature–Man" and "Fürer" / "Furer" all match.
function norm(s){
  return String(s).toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[\u2010-\u2015\u2212]/g,"-")
    .replace(/[\u2018\u2019\u02bc]/g,"'")
    .replace(/[\u201c\u201d]/g,'"')
    .replace(/\s+/g," ");
}
function viewSearch(){
  let list = [];
  if (query.length >= 2) {
    const q = norm(query);
    list = ITEMS.map(it => {
      const strong = norm(it.title + " " + it.gist + " " + it.deploy);
      const ents = norm([].concat(it.scholars,it.communities,it.law,it.figures).join(" "));
      const termtxt = norm(it.terms.map(t=>t[0]+" "+t[1]).join(" "));
      const rest = norm(it.news+" "+it.context+" "+it.mech+" "+it.synth.join(" "));
      let s = 0;
      if (strong.includes(q)) s += 10;
      if (ents.includes(q)) s += 6;
      if (termtxt.includes(q)) s += 4;
      if (rest.includes(q)) s += 1;
      return {it,s};
    }).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).map(x=>x.it);
  }
  return `<h2 class="vhead">Search</h2>
  <p class="vsub">Searches titles, notes, scholars, terminology and figures across every card.</p>
  <input class="searchbox" id="q" placeholder="Barth, Sixth Schedule, displacement, mosaic evolution…" value="${esc(query)}" autocomplete="off">
  <p class="hint">${query.length>=2 ? `${list.length} card${list.length===1?"":"s"} match` : "Type at least two characters."}</p>
  ${query.length>=2 ? cardsHTML(list) : ""}`;
}

  const bag = {};
  ITEMS.forEach(it => (it[entTab]||[]).forEach(e => { (bag[e] = bag[e] || []).push(it); }));
  const keys = Object.keys(bag).sort((a,b)=>a.localeCompare(b));
  const sub = {
    scholars:"Who recurs, and where. A scholar appearing across several weeks is doing the same analytical work each time — that is the pattern to notice.",
    communities:"Every tribe, caste and group named across the corpus. One community often appears in different structural positions in different systems.",
    law:"Statutes, judgments, commissions and constitutional provisions, with the cards that use them.",
    figures:"The numbers examiners reward. Each one carries its source card."
  }[entTab];
  return `<h2 class="vhead">Index</h2>
  <p class="vsub">${sub}</p>
  <div class="tabs">${ENT_TABS.map(([k,l])=>`<button data-ent="${k}" aria-selected="${entTab===k}">${l}</button>`).join("")}</div>
  <div class="ents">${keys.map(k=>
    `<button class="ent" data-entity="${esc(k)}"><span class="en">${esc(k)}</span><span class="ec">${bag[k].length}</span></button>`
  ).join("")}</div>`;
}

function viewEntity(){
  const list = ITEMS.filter(it => (it.scholars||[]).includes(arg) || (it.communities||[]).includes(arg)
    || (it.law||[]).includes(arg) || (it.figures||[]).includes(arg));
  return `<button class="back" data-go="index">← Index</button>
    <h2 class="vhead">${esc(arg)}</h2>
    <p class="vsub">Appears in ${list.length} card${list.length===1?"":"s"}.</p>
    ${cardsHTML(list)}`;
}

function buildDeck(scope){
  const pool = [];
  ITEMS.forEach(it => {
    if (scope === "revise" && marks[it.id] !== "revise") return;
    if (scope === "p1" && it.paper !== "1") return;
    if (scope === "p2" && it.paper !== "2") return;
    it.terms.forEach(([t,d]) => {
      const key = it.id + "::" + t;
      if (termMarks[key] === "solid") return;
      pool.push({t,d,it,key});
    });
  });
  for (let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  deck = pool; deckPos = 0; deckShown = false;
}
function viewRevise(){
  if (!deck.length) {
    return `<h2 class="vhead">Revise</h2>
    <p class="vsub">Terminology and scholar-linkage are pure recall. Pick a deck; cards you mark as known drop out and stay out.</p>
    <div class="flashbar">
      <button class="btn" data-deck="all">All terms</button>
      <button class="btn" data-deck="p1">Paper 1 only</button>
      <button class="btn" data-deck="p2">Paper 2 only</button>
      <button class="btn" data-deck="revise">Only cards marked “Revise”</button>
    </div>
    <p class="hint" style="margin-top:22px">${Object.values(termMarks).filter(v=>v==="solid").length} terms marked known so far.</p>`;
  }
  if (deckPos >= deck.length) {
    return `<h2 class="vhead">Deck finished</h2>
    <p class="vsub">You went through ${deck.length} term${deck.length===1?"":"s"}.</p>
    <div class="flashbar"><button class="btn" data-deck="reset">Choose another deck</button></div>`;
  }
  const c = deck[deckPos];
  return `<h2 class="vhead">Revise</h2>
  <p class="vsub">Card ${deckPos+1} of ${deck.length}</p>
  <div class="flash">
    <p class="q">${esc(c.t)}</p>
    <p class="meta">Paper ${c.it.paper} · ${c.it.units.map(u=>u[1]).join(", ")} · ${esc(c.it.title)}</p>
    ${deckShown ? `<p class="a">${esc(c.d)}</p>` : ""}
  </div>
  <div class="flashbar">
    ${deckShown
      ? `<button class="btn" data-flash="known">I knew it — retire this term</button>
         <button class="btn q" data-flash="again">Show again later</button>`
      : `<button class="btn" data-flash="show">Show the definition</button>`}
    <button class="btn q" data-flash="quit">End deck</button>
  </div>`;
}

function viewWeeks(){
  const keys = Object.keys(POSTS).sort((a,b)=>POSTS[b].date.localeCompare(POSTS[a].date));
  return `<h2 class="vhead">Weeks</h2>
  <p class="vsub">The source posts, newest first. Chronology is how the material arrives, not how you will use it.</p>
  ${keys.map(k=>{
    const p = POSTS[k], list = ITEMS.filter(i=>i.post===k);
    return `<div class="wk">
      <h3>${esc(p.title)}</h3>
      <div class="m">${esc(p.range)} · ${list.length} card${list.length===1?"":"s"} · <a href="${p.url}" target="_blank" rel="noopener">original post</a></div>
      <div class="t">${list.map(i=>`<button class="chip" data-card="${i.id}" style="--pc:${PC[i.paper]}">${esc(i.title)}</button>`).join("")}</div>
    </div>`;
  }).join("")}`;
}

function viewCard(){
  const it = ITEMS.find(i=>i.id===arg);
  if (!it) return viewWeeks();
  const lbl = {examples:"Example bank", search:"Search", weeks:"Weeks", index:"Index", map:"Syllabus map"}[cameFrom] || "Weeks";
  return `<button class="back" data-go="${cameFrom}">← ${lbl}</button><div class="cards">${cardHTML(it,true)}</div>`;
}

/* ---------------- render ---------------- */
function render(){
  renderNav();
  const m = document.getElementById("main");
  const fns = { map:viewMap, unit:viewUnit, examples:viewExamples, search:viewSearch,
                index:viewIndex, entity:viewEntity, revise:viewRevise, weeks:viewWeeks, card:viewCard };
  m.innerHTML = (fns[view] || viewMap)();
  if (view === "search") {
    const q = document.getElementById("q");
    q.focus(); q.setSelectionRange(q.value.length, q.value.length);
  }
}

/* ---------------- events ---------------- */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-go],[data-unit],[data-toggle],[data-mark],[data-ent],[data-entity],[data-deck],[data-flash],[data-card],[data-print],[data-extype],[data-exmode],[data-theme],[data-size],[data-focus]");
  if (!t) return;
  if (t.dataset.go) return go(t.dataset.go);
  if (t.dataset.unit) return go("unit", t.dataset.unit);
  if (t.dataset.entity) return go("entity", t.dataset.entity);
  if (t.dataset.card) { cameFrom = (view==="card") ? cameFrom : view; return go("card", t.dataset.card); }
  if (t.dataset.extype) { exType = t.dataset.extype; exMode = "list"; return render(); }
  if (t.dataset.exmode) { exMode = t.dataset.exmode; return render(); }
  if (t.dataset.ent) { entTab = t.dataset.ent; return render(); }
  if (t.dataset.print) { window.print(); return; }
  if (t.dataset.theme) { theme = t.dataset.theme; applyAppearance(); saveState(); return renderNav(); }
  if (t.dataset.size)  { rsize = t.dataset.size;  applyAppearance(); saveState(); return renderNav(); }
  if (t.dataset.focus) { focusMode = t.dataset.focus !== "off"; applyAppearance(); return renderNav(); }
  if (t.dataset.toggle) {
    const card = t.closest(".card");
    const open = card.dataset.open === "1";
    card.dataset.open = open ? "0" : "1";
    t.innerHTML = `<span class="tri">▶</span>${open ? "Read the full note" : "Hide the full note"}`;
    return;
  }
  if (t.dataset.mark) {
    const [id,val] = t.dataset.mark.split("|");
    marks[id] = marks[id] === val ? undefined : val;
    if (!marks[id]) delete marks[id];
    saveState();
    const card = t.closest(".card"), wasOpen = card.dataset.open === "1";
    const it = ITEMS.find(i=>i.id===id);
    card.outerHTML = cardHTML(it, wasOpen);
    renderNav();
    return;
  }
  if (t.dataset.deck) {
    const d = t.dataset.deck;
    if (d === "reset") { deck = []; return render(); }
    buildDeck(d); return render();
  }
  if (t.dataset.flash) {
    const a = t.dataset.flash;
    if (a === "show") { deckShown = true; }
    else if (a === "known") { termMarks[deck[deckPos].key] = "solid"; saveState(); deckPos++; deckShown = false; }
    else if (a === "again") { deckPos++; deckShown = false; }
    else if (a === "quit") { deck = []; }
    return render();
  }
});

document.addEventListener("change", e => {
  if (e.target.id === "exunit") { exUnit = e.target.value; render(); }
});

document.addEventListener("input", e => {
  if (e.target.id === "q") {
    query = e.target.value.trim();
    const pos = e.target.selectionStart;
    render();
    const q = document.getElementById("q");
    if (q) { q.focus(); q.setSelectionRange(pos,pos); }
  }
});

document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") { if (e.key === "Escape") e.target.blur(); return; }
  const n = NAV.find(x => x[2] === e.key);
  if (n) return go(n[0]);
  if (e.key === "/") { e.preventDefault(); go("search"); }
  if (e.key === "f" || e.key === "F") { focusMode = !focusMode; applyAppearance(); return renderNav(); }
  if (view === "revise" && deck.length && deckPos < deck.length) {
    if (e.key === " ") { e.preventDefault(); deckShown = true; render(); }
    if (deckShown && (e.key === "y" || e.key === "Y")) { termMarks[deck[deckPos].key]="solid"; saveState(); deckPos++; deckShown=false; render(); }
    if (deckShown && (e.key === "n" || e.key === "N")) { deckPos++; deckShown=false; render(); }
  }
});

if (window.matchMedia) {
  window.matchMedia("(prefers-color-scheme: dark)")
    .addEventListener("change", () => { if (theme === "auto") applyAppearance(); });
}
loadState().then(() => { applyAppearance(); render(); });
</script>
</body>
</html>
